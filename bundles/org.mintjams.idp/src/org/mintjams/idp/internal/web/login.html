<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Identity Provider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/*
 * This page is the frame around the sign-in flow. The flow itself (password,
 * verification code, passkey) is rendered into #idp-login by /idp/login/app.js
 * and picks up the --idp-* custom properties below, so restyle the page
 * freely: logo, colours, background, footer. Keep the #idp-login element and
 * the module script at the bottom.
 */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090A;
  --text:#E8E6E1;
  --text-muted:#6B6961;
  --text-dim:#4A4940;
  --text-ghost:#3A3930;
  --green-600:#639922;
  --green-500:#7AAD3A;
  --green-400:#97C459;
  --green-dark:#4A7318;

  /* Sign-in flow theme (read by app.js) */
  --idp-font:'DM Sans',system-ui,sans-serif;
  --idp-text:var(--text);
  --idp-muted:var(--text-muted);
  --idp-dim:var(--text-dim);
  --idp-ghost:var(--text-ghost);
  --idp-card:rgba(255,255,255,0.025);
  --idp-card-border:rgba(255,255,255,0.06);
  --idp-input-bg:rgba(255,255,255,0.04);
  --idp-input-border:rgba(255,255,255,0.08);
  --idp-focus:rgba(99,153,34,0.5);
  --idp-accent:linear-gradient(135deg,var(--green-600),var(--green-dark));
  --idp-accent-contrast:#fff;
  --idp-accent-text:var(--green-400);
  --idp-accent-glow:rgba(99,153,34,0.06);
  --idp-accent-border:rgba(99,153,34,0.12);
  --idp-error:#E24B4A;
  --idp-error-border:rgba(226,75,74,0.4);
  --idp-radius:10px;
  --idp-radius-sm:8px;
  --idp-radius-lg:16px;
}
body{
  min-height:100vh;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'DM Sans',system-ui,sans-serif;
  color:var(--text);
  overflow:hidden;
  position:relative;
}

/* Background dots */
body::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(255,255,255,0.5) 0.8px,transparent 0.8px);
  background-size:32px 32px;
  opacity:0.025;pointer-events:none;
}

/* Accent glow */
body::after{
  content:'';position:absolute;top:-200px;left:-100px;
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(99,153,34,0.06) 0%,transparent 70%);
  pointer-events:none;
}

.wrapper{
  width:420px;max-width:calc(100vw - 32px);
  position:relative;z-index:1;
  opacity:0;transform:translateY(16px);
}
.wrapper.ready{
  animation:mount 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
}

/* Header */
.header{text-align:center;margin-bottom:40px}
.logo{
  width:48px;height:48px;margin:0 auto 20px;
  background:linear-gradient(135deg,var(--green-600),var(--green-dark));
  border-radius:12px;display:flex;align-items:center;justify-content:center;
}
.header h1{font-size:20px;font-weight:500;letter-spacing:-0.02em;margin-bottom:6px}
.header p{font-size:13px;color:var(--text-muted)}

/* Footer */
.footer{margin-top:28px;text-align:center}
.saml-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;color:var(--text-ghost);
  padding:5px 12px;
  border:1px solid rgba(255,255,255,0.04);
  border-radius:100px;margin-bottom:16px;
}
.footer-links{
  display:flex;justify-content:center;gap:20px;
  font-size:11px;
}
.footer-links a{color:var(--text-dim);text-decoration:none;cursor:pointer}
.footer-links a:hover{color:var(--text-muted)}

@keyframes mount{to{opacity:1;transform:translateY(0)}}

@media(max-width:480px){
  .wrapper{width:100%}
}
</style>
</head>
<body>

<div class="wrapper" id="wrapper">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z" stroke="#fff" stroke-width="2" fill="none"/>
        <path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Sign in</h1>
    <p>Authenticate with your identity provider</p>
  </div>

  <!-- Sign-in flow (rendered by /idp/login/app.js) -->
  <div id="idp-login"></div>

  <!-- Footer -->
  <div class="footer">
    <div class="saml-badge">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#4A4940" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0110 0v4"/>
      </svg>
      SAML 2.0 secured connection
    </div>
    <div class="footer-links">
      <a href="#">Help</a>
      <a href="#">Terms</a>
      <a href="#">Privacy</a>
    </div>
  </div>

</div>

<script>
// Reveal the page once the flow has loaded its options (avoids a flash of an
// empty card). app.js dispatches "idp-login-ready" on the mount element.
document.addEventListener('idp-login-ready', function () {
  document.getElementById('wrapper').classList.add('ready');
});
</script>
<script type="module" src="/idp/login/app.js"></script>

</body>
</html>
