<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
	<title>Tasks</title>

	<!-- Bootstrap Icons (bundled with webtop; see webtop/rollup.config.js) -->
	<link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css?v=__BUILD_VERSION__">

	<!-- Default CSS -->
	<link href="./assets/css/style.css?v=__BUILD_VERSION__" rel="stylesheet" />
	<link href="../../assets/css/webtop-app.css?v=__BUILD_VERSION__" rel="stylesheet" />
</head>

<body>
<div id="app" v-cloak class="d-flex flex-column" :class="{ 'is-resizing': isResizing }" @mounted="onMounted" @unmount="onUnmount">

	<!-- Readiness gate: the screen is compiled only after appLaunch() has
	     loaded the component templates and flipped isReady, so every <wt-*>
	     element is connected with its <template> already present. A
	     <template> fragment (not a wrapper <div>) keeps #app's flex layout
	     unchanged; the gated markup is intentionally not re-indented. -->
	<template v-if="isReady">

	<!-- ============================================================
	     Top Toolbar (translucent)
	     ============================================================ -->
	<nav class="nav-bar window-drag-region">

		<!-- Left: mode group (Runtime / History / Start) -->
		<div class="toolbar-group">
			<button class="btn-icon"
				:class="{active: mode === 'tasks-runtime'}"
				@click="switchMode('tasks-runtime')"
				:title="t('app.tasks.mode.runtime', undefined, 'My tasks (running)')">
				<i class="bi bi-inbox-fill"></i>
			</button>
			<button class="btn-icon"
				:class="{active: mode === 'tasks-history'}"
				@click="switchMode('tasks-history')"
				:title="t('app.tasks.mode.history', undefined, 'My tasks (completed)')">
				<i class="bi bi-archive"></i>
			</button>
			<button class="btn-icon"
				:class="{active: mode === 'start'}"
				@click="switchMode('start')"
				:title="t('app.tasks.mode.start', undefined, 'Start a process')">
				<i class="bi bi-play-fill"></i>
			</button>
		</div>

		<!-- Left: refresh -->
		<div class="toolbar-group">
			<button class="btn-icon" @click="refresh" :title="t('app.tasks.toolbar.refresh', undefined, 'Refresh (F5)')">
				<i class="bi bi-arrow-clockwise"></i>
			</button>
		</div>

		<span class="nav-spacer"></span>

		<!-- Right: pane toggles -->
		<div class="pane-toggles">
			<button class="btn-icon pane-toggle-btn" :class="{active: searchPanelVisible}"
				@click="toggleSearchPanel" :title="t('app.tasks.toolbar.toggleFilters', undefined, 'Toggle filters')">
				<i class="bi bi-funnel"></i>
			</button>
			<button class="btn-icon pane-toggle-btn" :class="{active: listPanelVisible}"
				@click="toggleListPanel" :title="t('app.tasks.toolbar.toggleList', undefined, 'Toggle list')">
				<i class="bi bi-list-task"></i>
			</button>
		</div>

		<!-- Right: window controls -->
		<div class="window-controls">
			<button class="btn-icon" @click="onMinimizeWindow" :title="t('app.tasks.window.minimize', undefined, 'Minimize')">
				<i class="bi bi-dash-lg"></i>
			</button>
			<button class="btn-icon" @click="onToggleMaximizeWindow" :title="t('app.tasks.window.maximize', undefined, 'Maximize')">
				<i class="bi bi-square"></i>
			</button>
			<button class="btn-icon window-control-close" @click="onCloseWindow" :title="t('app.tasks.window.close', undefined, 'Close')">
				<i class="bi bi-x-lg"></i>
			</button>
		</div>
	</nav>

	<!-- ============================================================
	     Content body — 3 columns: search / list / form
	     ============================================================ -->
	<div class="content-body">

		<!-- ============================================================
		     LEFT PANE — search filters
		     ============================================================ -->
		<div v-if="searchPanelVisible" class="search-panel island p-0"
			:style="{ width: searchPanelWidth + 'px' }">

			<div class="pane-scroll">
				<!-- Tasks (Runtime) filters -->
				<div v-if="mode === 'tasks-runtime'">
					<div class="filter-group">
						<wt-field :label="t('app.tasks.filter.keyword', undefined, 'Keyword')">
							<wt-search-box v-model="filters.taskKeyword" @change="filterList"
								:placeholder="t('app.tasks.filter.taskKeywordPlaceholder', undefined, 'Name, process, business key…')"></wt-search-box>
						</wt-field>
					</div>

					<div class="filter-group">
						<label class="filter-label">{{ t('app.tasks.filter.scope', undefined, 'Scope') }}</label>
						<label class="filter-check">
							<input type="radio" class="wt" name="task-scope" value="assigned"
								v-model="filters.scope" @change="loadTasks">
							<span>{{ t('app.tasks.filter.scope.assigned', undefined, 'Assigned to me') }}</span>
						</label>
						<label class="filter-check">
							<input type="radio" class="wt" name="task-scope" value="candidate"
								v-model="filters.scope" @change="loadTasks">
							<span>{{ t('app.tasks.filter.scope.candidate', undefined, 'Candidate (my groups)') }}</span>
						</label>
						<label class="filter-check">
							<input type="radio" class="wt" name="task-scope" value="all"
								v-model="filters.scope" @change="loadTasks">
							<span>{{ t('app.tasks.filter.scope.all', undefined, 'All') }}</span>
						</label>
					</div>

					<div class="filter-group">
						<div class="filter-label-row">
							<label class="filter-label">{{ t('app.tasks.filter.processDefinition', undefined, 'Process definition') }}</label>
							<button v-if="filters.processDefinitionKeys.length > 0"
								type="button"
								class="filter-clear-btn"
								@click="clearDefKeySelection"
								:title="t('app.tasks.filter.clearSelection', undefined, 'Clear selection')">
								{{ t('app.tasks.action.clear', undefined, 'Clear') }}
							</button>
						</div>
						<div v-if="definitions.length === 0" class="filter-hint mt-0">
							{{ t('app.tasks.filter.noProcessDefinitions', undefined, 'No process definitions deployed.') }}
						</div>
						<div v-else class="def-checkbox-list">
							<wt-checkbox v-for="def in definitions" :key="def.id" class="def-checkbox-item"
								:model-value="!!selectedDefKeyMap[def.key]"
								@change="toggleDefKey(def.key)">
								<span class="def-checkbox-label">{{ def.name || def.key }}</span>
							</wt-checkbox>
						</div>
					</div>

					<div class="filter-group">
						<wt-field :label="t('app.tasks.filter.due', undefined, 'Due')">
							<wt-select v-model="filters.dueRange" :items="dueItems" @change="filterList"></wt-select>
						</wt-field>
					</div>

					<div class="filter-group">
						<wt-field :label="t('app.tasks.filter.priorityMin', undefined, 'Priority (≥)')">
							<input type="number" class="wt w-100" min="0" max="100" step="1"
								v-model.number="filters.priorityMin" @input="filterList"
								placeholder="0">
						</wt-field>
					</div>
				</div>

				<!-- Tasks (History) filters -->
				<div v-if="mode === 'tasks-history'">
					<div class="filter-group">
						<wt-field :label="t('app.tasks.filter.keyword', undefined, 'Keyword')">
							<wt-search-box v-model="filters.taskKeyword" @change="filterList"
								:placeholder="t('app.tasks.filter.taskKeywordPlaceholder', undefined, 'Name, process, business key…')"></wt-search-box>
						</wt-field>
					</div>
					<div class="filter-group">
						<p class="filter-hint mt-0">
							{{ t('app.tasks.history.hint', undefined, 'Completed tasks are sourced from the Camunda history; this view is currently read-only.') }}
						</p>
					</div>
				</div>

				<!-- Process Start filters -->
				<div v-if="mode === 'start'">
					<div class="filter-group">
						<wt-field :label="t('app.tasks.filter.keyword', undefined, 'Keyword')">
							<wt-search-box v-model="filters.defKeyword" @change="filterList"
								:placeholder="t('app.tasks.filter.defKeywordPlaceholder', undefined, 'Name, key, description…')"></wt-search-box>
						</wt-field>
					</div>

					<div class="filter-group">
						<wt-field :label="t('app.tasks.filter.category', undefined, 'Category')">
							<wt-select v-model="filters.category" :items="categoryItems" @change="filterList"></wt-select>
						</wt-field>
					</div>

					<div class="filter-group">
						<wt-checkbox v-model="filters.favoritesOnly" @change="filterList"
							:label="t('app.tasks.filter.favoritesOnly', undefined, 'Favorites only')"></wt-checkbox>
					</div>
				</div>
			</div>
		</div>

		<!-- Search resize handle -->
		<wt-splitter v-if="searchPanelVisible" v-model:size="searchPanelWidth" :min="180" :max="420"
			@resize-start="resizingPane = true" @resize-end="resizingPane = false"></wt-splitter>

		<!-- ============================================================
		     MIDDLE PANE — task / process definition list
		     ============================================================ -->
		<div v-if="listPanelVisible" class="list-panel island p-0"
			:style="{ width: listPanelWidth + 'px' }">

			<div v-if="isLoading && filteredItems.length === 0" class="list-empty">
				<wt-spinner size="sm"></wt-spinner>
				<span>{{ t('app.tasks.list.loading', undefined, 'Loading…') }}</span>
			</div>

			<div v-else-if="filteredItems.length === 0" class="list-empty">
				<i class="bi bi-inbox"></i>
				<span>{{ emptyListMessage }}</span>
			</div>

			<!-- Tasks list (runtime/history) -->
			<div v-if="mode !== 'start'" class="pane-scroll">
				<div v-for="task in filteredItems" :key="task.id"
					class="task-item"
					:class="{selected: selectedTask && selectedTask.id === task.id}"
					@click="selectTask(task)">
					<div class="task-item-row1">
						<span v-if="!task.assignee" class="task-badge task-badge-unassigned" :title="t('app.tasks.badge.unassigned', undefined, 'Unassigned')">
							<i class="bi bi-person-dash"></i>
						</span>
						<span v-else-if="task.assignee === currentUserID" class="task-badge task-badge-mine" :title="t('app.tasks.badge.assignedToMe', undefined, 'Assigned to me')">
							<i class="bi bi-person-check-fill"></i>
						</span>
						<span v-else class="task-badge task-badge-other" :title="t('app.tasks.badge.assignedTo', { assignee: task.assignee }, 'Assigned to {assignee}')">
							<i class="bi bi-person-fill"></i>
						</span>
						<span class="task-item-name">{{ task.name || task.taskDefinitionKey }}</span>
						<span v-if="task.priority >= 75" class="task-badge task-badge-priority" :title="t('app.tasks.badge.highPriority', undefined, 'High priority')">
							<i class="bi bi-flag-fill"></i>
						</span>
					</div>
					<div class="task-item-row2">
						<span class="task-process-name">{{ resolveProcessName(task) }}</span>
						<span v-if="task.businessKey" class="task-business-key" :title="t('app.tasks.list.businessKey', { key: task.businessKey }, 'Business key: {key}')">
							#{{ task.businessKey }}
						</span>
					</div>
					<div class="task-item-row3">
						<span v-if="task.due" :class="['task-due', {overdue: isOverdue(task.due)}]">
							<i class="bi bi-clock"></i>
							{{ formatRelativeDate(task.due) }}
						</span>
						<span v-else class="task-meta">{{ t('app.tasks.list.createdAt', { when: formatRelativeDate(task.created) }, 'created {when}') }}</span>
						<span v-if="task.assignee && task.assignee !== currentUserID" class="task-meta">
							· {{ task.assignee }}
						</span>
					</div>
				</div>
			</div>

			<!-- Process definitions list (start) -->
			<div v-else class="pane-scroll">
				<div v-for="def in filteredItems" :key="def.id"
					class="def-item"
					:class="{selected: selectedDef && selectedDef.id === def.id}"
					@click="selectDefinition(def)">
					<div class="def-item-row1">
						<button class="btn-icon def-fav-btn"
							:class="{active: favorites[def.key]}"
							@click.stop="toggleFavorite(def)"
							:title="favorites[def.key] ? t('app.tasks.action.removeFavorite', undefined, 'Remove from favorites') : t('app.tasks.action.addFavorite', undefined, 'Add to favorites')">
							<i class="bi" :class="favorites[def.key] ? 'bi-star-fill' : 'bi-star'"></i>
						</button>
						<span class="def-item-name">{{ def.name || def.key }}</span>
						<span class="def-item-version">{{ t('app.tasks.def.version', { version: def.version }, 'v{version}') }}</span>
					</div>
					<div class="def-item-row2">
						<span class="def-item-key">{{ def.key }}</span>
						<span v-if="def.category" class="def-item-category">· {{ def.category }}</span>
					</div>
					<div v-if="def.description" class="def-item-row3">
						{{ def.description }}
					</div>
				</div>
			</div>
		</div>

		<!-- List resize handle -->
		<wt-splitter v-if="listPanelVisible" v-model:size="listPanelWidth" :min="220" :max="560"
			@resize-start="resizingPane = true" @resize-end="resizingPane = false"></wt-splitter>

		<!-- ============================================================
		     RIGHT PANE — form (iframe)
		     ============================================================ -->
		<div class="form-panel island p-0">

			<!-- Form context bar (just inside the form panel) -->
			<div class="form-context-bar">
				<div class="form-context-info">
					<span v-if="mode === 'start' && selectedDef" class="form-context-title">
						<i class="bi bi-play-fill"></i>
						<strong>{{ selectedDef.name || selectedDef.key }}</strong>
						<span class="form-context-sub">{{ t('app.tasks.def.version', { version: selectedDef.version }, 'v{version}') }}</span>
					</span>
					<span v-else-if="mode !== 'start' && selectedTask" class="form-context-title">
						<i class="bi bi-card-checklist"></i>
						<strong>{{ selectedTask.name || selectedTask.taskDefinitionKey }}</strong>
						<span v-if="selectedTask.assignee" class="form-context-sub">
							· {{ selectedTask.assignee === currentUserID ? t('app.tasks.context.me', undefined, 'me') : selectedTask.assignee }}
						</span>
						<span v-else class="form-context-sub form-context-warn">· {{ t('app.tasks.context.unassigned', undefined, 'unassigned') }}</span>
					</span>
					<span v-else class="form-context-placeholder">
						{{ contextPlaceholder }}
					</span>
				</div>
				<div class="form-context-actions">
					<!-- Task assignment actions -->
					<template v-if="mode !== 'start' && selectedTask && !selectedTask.completed">
						<button v-if="!selectedTask.assignee"
							class="wt wt-slim wt-primary"
							@click="claimSelectedTask"
							:title="t('app.tasks.action.claim.title', undefined, 'Claim this task')">
							<i class="bi bi-person-check me-1"></i>{{ t('app.tasks.action.claim', undefined, 'Claim') }}
						</button>
						<button v-else-if="selectedTask.assignee === currentUserID"
							class="wt wt-slim"
							@click="unclaimSelectedTask"
							:title="t('app.tasks.action.unclaim.title', undefined, 'Release this task')">
							<i class="bi bi-person-dash me-1"></i>{{ t('app.tasks.action.unclaim', undefined, 'Unclaim') }}
						</button>
						<button v-else
							class="wt wt-slim"
							@click="confirmTakeOverSelectedTask"
							:title="t('app.tasks.action.takeover.title', undefined, 'Take over this task')">
							<i class="bi bi-arrow-left-right me-1"></i>{{ t('app.tasks.action.takeover', undefined, 'Take over') }}
						</button>
						<button class="wt wt-slim"
							@click="showAssignDialog"
							:title="t('app.tasks.action.assign.title', undefined, 'Assign to another user')">
							<i class="bi bi-person-gear"></i>
						</button>
					</template>
				</div>
			</div>

			<!-- Form body -->
			<div class="form-body">
				<!-- Empty state -->
				<div v-if="!hasSelection" class="form-empty">
					<i class="bi bi-card-text"></i>
					<span>{{ emptyFormMessage }}</span>
				</div>

				<!-- No formKey state -->
				<div v-else-if="!currentFormKey" class="form-empty">
					<i class="bi bi-exclamation-circle"></i>
					<span>{{ noFormKeyMessage }}</span>
				</div>

				<!--
					Loaded form. The iframe and the states layered over it are
					siblings rather than v-else-if branches, because the overlay
					has to cover the frame WHILE it starts up — the same shape
					wt-window uses for its `launching` / `launch-failed` panes.
					Branching would unmount the frame and defeat the point.
				-->
				<template v-else>
					<!--
						Form iframe — SAME-ORIGIN, deliberately NOT sandboxed.

						The form is user-authored HTML stored in the CMS and served
						from this very origin (/bin/cms.cgi/...). Running it under
						`sandbox` without `allow-same-origin` put it in an opaque
						origin, which broke every same-origin affordance a form
						actually needs: webtop's stylesheets could not pull their
						@font-face files, credentialed fetches were impossible, and
						the only channel to the host was a postMessage RPC bridge.

						Dropping `sandbox` makes the form an ordinary same-origin
						document: it loads webtop's CSS/fonts directly and talks to
						the host through `window.parent.TasksFormHost` (see app.ts),
						which hands it the live GraphQL client. Deploying a form is
						therefore as privileged as deploying an app — the JCR write
						ACL on the form node is the trust boundary.
					-->
					<iframe v-if="formSrc"
						class="form-frame"
						:src="formSrc"
						allow="clipboard-read; clipboard-write"></iframe>

					<!--
						Loading overlay — covers formKey resolution and the
						form's own startup as one state. Comes down only when
						the form calls TasksFormHost.notifyReady(); the frame's
						`load` event is deliberately not used, because it fires
						before a form that fetches its own data has anything to
						show.
					-->
					<div v-if="formPending" class="form-overlay">
						<wt-spinner size="sm"></wt-spinner>
						<span>{{ t('app.tasks.form.loading', undefined, 'Loading form…') }}</span>
					</div>

					<!-- Form load / startup failure -->
					<div v-else-if="formError" class="form-overlay form-error">
						<i class="bi bi-exclamation-triangle-fill"></i>
						<span>{{ formError }}</span>
						<button type="button" class="wt wt-slim" @click="reloadForm">
							<i class="bi bi-arrow-clockwise me-1"></i>{{ t('app.tasks.form.retry', undefined, 'Retry') }}
						</button>
					</div>
				</template>
			</div>
		</div>
	</div>

	<!-- ============================================================
	     Status bar
	     ============================================================ -->
	<div class="status-bar window-drag-region">
		<div class="status-group">
			<span class="status-item"><i class="bi bi-person me-1"></i>{{ currentUserDisplay }}</span>
			<span class="status-divider"></span>
			<span class="status-item">{{ mode === 'start' ? t('app.tasks.status.processCount', { count: filteredItems.length }, '{count} process(es)') : t('app.tasks.status.taskCount', { count: filteredItems.length }, '{count} task(s)') }}</span>
		</div>
		<span class="nav-spacer"></span>
		<div class="status-group">
			<span v-if="isLoading" class="status-item"><wt-spinner size="sm" class="me-1"></wt-spinner>{{ t('app.tasks.status.loading', undefined, 'Loading') }}</span>
		</div>
	</div>

	<!-- ============================================================
	     Error / Notice Dialog
	     ============================================================ -->
	<wt-dialog :open="!!errorMessage" size="sm" @close="errorMessage = ''">
		<template v-slot:title="d">
			<i class="bi bi-exclamation-triangle-fill me-2"></i>{{ t('app.tasks.dialog.notice.title', undefined, 'Notice') }}
		</template>
		<template v-slot="d">
			<p class="mt-0 mb-0">{{ errorMessage }}</p>
		</template>
		<template v-slot:footer="d">
			<button class="wt wt-primary" @click="errorMessage = ''">{{ t('app.tasks.action.ok', undefined, 'OK') }}</button>
		</template>
	</wt-dialog>

	<!-- ============================================================
	     Take Over Confirmation Dialog
	     ============================================================ -->
	<wt-dialog :open="dialog.type === 'takeover'" size="sm" @close="closeDialog">
		<template v-slot:title="d">
			<i class="bi bi-arrow-left-right me-2"></i>{{ t('app.tasks.dialog.takeover.title', undefined, 'Take Over Task') }}
		</template>
		<template v-slot="d">
			<p class="mt-0">{{ t('app.tasks.dialog.takeover.confirm', { taskName: dialog.data.taskName, assignee: dialog.data.currentAssignee }, 'Take over "{taskName}" from "{assignee}"?') }}</p>
			<p class="mb-0 small text-muted">
				{{ t('app.tasks.dialog.takeover.note', undefined, 'You will become the new assignee. The previous assignee will lose access to this task.') }}
			</p>
		</template>
		<template v-slot:footer="d">
			<button class="wt" @click="closeDialog">{{ t('app.tasks.action.cancel', undefined, 'Cancel') }}</button>
			<button class="wt wt-primary" @click="executeTakeOver">{{ t('app.tasks.action.takeover', undefined, 'Take over') }}</button>
		</template>
	</wt-dialog>

	<!-- ============================================================
	     Assign Task Dialog
	     ============================================================ -->
	<wt-dialog :open="dialog.type === 'assign'" @close="closeDialog">
		<template v-slot:title="d">
			<i class="bi bi-person-gear me-2"></i>{{ t('app.tasks.dialog.assign.title', undefined, 'Assign Task') }}
		</template>
		<template v-slot="d">
			<p class="mt-0">{{ t('app.tasks.dialog.assign.intro', { taskName: dialog.data.taskName }, 'Reassign "{taskName}" to another user. Search by username, display name, or email — any user can be selected.') }}</p>
			<wt-field :label="t('app.tasks.dialog.assign.userLabel', undefined, 'User')">
				<div class="position-relative">
					<input class="wt w-100" type="text" ref="assigneeInput"
						v-model="dialog.data.assignee"
						@input="onAssigneeSearchInput"
						@focus="onAssigneeSearchFocus"
						:placeholder="t('app.tasks.dialog.assign.searchPlaceholder', undefined, 'Search user...')"
						autocomplete="off"
						autofocus>
					<div v-if="dialog.data.isSearching" class="input-group-actions">
						<wt-spinner size="sm"></wt-spinner>
					</div>
				</div>
			</wt-field>
			<div v-if="dialog.data.assigneeDisplayName" class="mt-1 small text-muted">
				{{ t('app.tasks.dialog.assign.selected', undefined, 'Selected:') }} <strong>{{ dialog.data.assigneeDisplayName }}</strong>
				<span> ({{ dialog.data.assignee }})</span>
			</div>
		</template>
		<template v-slot:footer="d">
			<button class="wt" @click="closeDialog">{{ t('app.tasks.action.cancel', undefined, 'Cancel') }}</button>
			<button class="wt wt-primary" :disabled="!dialog.data.assignee" @click="executeAssign">{{ t('app.tasks.action.assign', undefined, 'Assign') }}</button>
		</template>
	</wt-dialog>

	</template>
	<!-- /Readiness gate -->
</div>

	<script type="module" src="./app.js?v=__BUILD_VERSION__"></script>
</body>
</html>
