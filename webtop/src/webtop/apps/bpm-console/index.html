<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
	<title>BPM Console</title>

	<!-- Bootstrap Icons (bundled with webtop; see webtop/rollup.config.js) -->
	<link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css?v=__BUILD_VERSION__">

	<!-- Default CSS -->
	<link href="./assets/css/style.css?v=__BUILD_VERSION__" rel="stylesheet" />
	<link href="../../assets/css/webtop-app.css?v=__BUILD_VERSION__" rel="stylesheet" />
</head>

<body>
<div id="app" v-cloak class="d-flex flex-column" @mounted="onMounted" @unmount="onUnmount">

	<!-- Readiness gate: the screen is compiled only after appLaunch() has
	     loaded the component templates and flipped isReady, so every <wt-*>
	     element is connected with its <template> already present. A
	     <template> fragment (not a wrapper <div>) keeps #app's flex layout
	     unchanged; the gated markup is intentionally not re-indented. -->
	<template v-if="isReady">

	<!-- Top Toolbar (translucent) -->
	<nav class="nav-bar window-drag-region">
		<!-- Left: refresh + deploy -->
		<div class="toolbar-group">
			<button class="btn-icon"
				:class="{active: liveTailActive}"
				@pointerdown="onRefreshPointerDown"
				@pointerup="onRefreshPointerUp"
				@pointerleave="cancelLiveTailPress"
				@pointercancel="cancelLiveTailPress"
				:title="liveTailActive ? t('app.bpm-console.toolbar.liveTailOn', undefined, 'Live tail ON — click to stop') : t('app.bpm-console.toolbar.refresh', undefined, 'Refresh (hold 1.5s for live tail)')">
				<wt-spinner v-if="liveTailActive" size="sm"></wt-spinner>
				<i v-else class="bi bi-arrow-clockwise"></i>
			</button>
			<button class="btn-icon" @click="showDeployDialog" :title="t('app.bpm-console.toolbar.deployBpmn', undefined, 'Deploy BPMN')">
				<i class="bi bi-cloud-upload"></i>
			</button>
		</div>

		<!-- Left: view mode (diagram / XML) -->
		<div class="toolbar-group">
			<button class="btn-icon"
				:class="{active: viewMode === 'diagram'}"
				:disabled="!selectedDef"
				@click="viewMode = 'diagram'" :title="t('app.bpm-console.toolbar.diagramView', undefined, 'Diagram view')">
				<i class="bi bi-diagram-3"></i>
			</button>
			<button class="btn-icon"
				:class="{active: viewMode === 'xml'}"
				:disabled="!selectedDef"
				@click="switchToXmlView" :title="t('app.bpm-console.toolbar.xmlView', undefined, 'XML view')">
				<i class="bi bi-code-slash"></i>
			</button>
		</div>

		<!-- Left: zoom controls -->
		<div class="toolbar-group">
			<button class="btn-icon"
				:disabled="!selectedDef || viewMode !== 'diagram'"
				@click="zoomIn" :title="t('app.bpm-console.toolbar.zoomIn', undefined, 'Zoom in')">
				<i class="bi bi-zoom-in"></i>
			</button>
			<button class="btn-icon"
				:disabled="!selectedDef || viewMode !== 'diagram'"
				@click="zoomOut" :title="t('app.bpm-console.toolbar.zoomOut', undefined, 'Zoom out')">
				<i class="bi bi-zoom-out"></i>
			</button>
			<button class="btn-icon"
				:disabled="!selectedDef || viewMode !== 'diagram'"
				@click="zoomFit" :title="t('app.bpm-console.toolbar.zoomFit', undefined, 'Fit to screen')">
				<i class="bi bi-arrows-fullscreen"></i>
			</button>
		</div>

		<!-- Left: start new instance -->
		<div class="toolbar-group">
			<button class="btn-icon"
				:disabled="!selectedDef || selectedDef.suspended"
				@click="startProcessDialog"
				:title="selectedDef && selectedDef.suspended ? t('app.bpm-console.toolbar.startInstanceDisabled', undefined, 'Cannot start: definition is suspended') : t('app.bpm-console.toolbar.startInstance', undefined, 'Start new instance')">
				<i class="bi bi-play-fill"></i>
			</button>
		</div>

		<span class="nav-spacer"></span>

		<!-- Right: Pane Toggles -->
		<div class="pane-toggles">
			<button class="btn-icon pane-toggle-btn" :class="{active: sidebarPanelVisible}"
				@click="toggleSidebarPanel" :title="t('app.bpm-console.toolbar.toggleSidebar', undefined, 'Toggle Sidebar')">
				<i class="bi bi-layout-sidebar-inset"></i>
			</button>
			<button class="btn-icon pane-toggle-btn" :class="{active: bottomPanelVisible}"
				@click="toggleBottomPanel" :title="t('app.bpm-console.toolbar.toggleLists', undefined, 'Toggle Lists')">
				<i class="bi bi-layout-split"></i>
			</button>
			<button class="btn-icon pane-toggle-btn" :class="{active: detailPanelVisible}"
				@click="toggleDetailPanel" :title="t('app.bpm-console.toolbar.toggleDetails', undefined, 'Toggle Details')">
				<i class="bi bi-layout-sidebar-inset-reverse"></i>
			</button>
		</div>

		<!-- Right: Window Controls -->
		<div class="window-controls">
			<button class="btn-icon" @click="onMinimizeWindow" :title="t('common.minimize', undefined, 'Minimize')">
				<i class="bi bi-dash-lg"></i>
			</button>
			<button class="btn-icon" @click="onToggleMaximizeWindow" :title="t('common.maximize', undefined, 'Maximize')">
				<i class="bi bi-square"></i>
			</button>
			<button class="btn-icon window-control-close" @click="onCloseWindow" :title="t('common.close', undefined, 'Close')">
				<i class="bi bi-x-lg"></i>
			</button>
		</div>
	</nav>

	<!-- Content body — 3 columns: sidebar / center / detail -->
	<div class="content-body">

		<!-- ============================================================
		     LEFT PANE — process definition tree
		     ============================================================ -->
		<div v-if="sidebarPanelVisible" class="sidebar-panel island p-0"
			:style="{ width: sidebarPanelWidth + 'px' }">

			<!-- Filter -->
			<div class="sidebar-filter">
				<wt-search-box v-model="defSearch" @change="filterDefs"
					:placeholder="t('app.bpm-console.filter.placeholder', undefined, 'Filter processes...')"></wt-search-box>
			</div>

			<!-- Process tree -->
			<div class="list-body">
				<div v-if="filteredGroups.length === 0 && !isLoading" class="list-empty-message">
					{{ t('app.bpm-console.empty.noDefinitions', undefined, 'No process definitions found') }}
				</div>
				<div v-for="group in filteredGroups" :key="group.key">
					<!-- Group header -->
					<div class="tree-group-header"
						:class="{ selected: selectedGroup && selectedGroup.key === group.key && !selectedDef }"
						@click="selectGroup(group)">
						<span class="tree-toggle" @click.stop="toggleGroupExpand(group)">
							<i class="bi"
								:class="group.expanded ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
						</span>
						<i class="bi bi-diagram-3 tree-node-icon"></i>
						<div class="tree-group-info">
							<div class="tree-group-name">{{ group.name }}</div>
							<div class="tree-group-key">{{ group.key }}</div>
						</div>
						<wt-badge v-if="groupIncidentCounts[group.key]" variant="danger" :title="t('app.bpm-console.badge.totalIncidents', undefined, 'Total incidents')">
							{{ groupIncidentCounts[group.key] }}
						</wt-badge>
						<wt-badge>{{ group.versions.length }}</wt-badge>
					</div>
					<!-- Version items -->
					<div v-if="group.expanded">
						<div v-for="def in group.versions" :key="def.id"
							class="tree-leaf"
							:class="{ selected: selectedDef && selectedDef.id === def.id }"
							@click="selectDefinition(def)"
							@contextmenu.prevent="showDefContextMenu(event, def)">
							<div class="tree-leaf-info">
								<div class="tree-leaf-name">
									<span>v{{ def.version }}</span>
									<wt-badge v-if="def.version === group.latestVersion" variant="primary">{{ t('app.bpm-console.badge.latest', undefined, 'Latest') }}</wt-badge>
									<wt-badge v-if="defInstanceCounts[def.id] && defInstanceCounts[def.id].active > 0"
										variant="primary" :title="t('app.bpm-console.badge.activeInstances', undefined, 'Active instances')">
										<i class="bi bi-play-fill"></i>{{ defInstanceCounts[def.id].active }}
									</wt-badge>
									<wt-badge v-if="defIncidentCounts[def.id]"
										variant="danger" :title="t('app.bpm-console.badge.incidents', undefined, 'Incidents')">
										<i class="bi bi-exclamation-triangle-fill"></i>{{ defIncidentCounts[def.id] }}
									</wt-badge>
									<wt-badge v-if="defInstanceCounts[def.id] && defInstanceCounts[def.id].ended > 0"
										:title="t('app.bpm-console.badge.endedInstances', undefined, 'Ended instances')">
										<i class="bi bi-check2"></i>{{ defInstanceCounts[def.id].ended }}
									</wt-badge>
								</div>
								<div v-if="def.deploymentName" class="tree-leaf-sub">{{ def.deploymentName }}</div>
							</div>
							<i v-if="def.suspended" class="bi bi-pause-circle bpm-state-icon suspended" :title="t('app.bpm-console.status.suspended', undefined, 'Suspended')"></i>
							<i v-else class="bi bi-check-circle-fill bpm-state-icon active" :title="t('app.bpm-console.status.active', undefined, 'Active')"></i>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Sidebar resize handle -->
		<wt-splitter v-if="sidebarPanelVisible" v-model:size="sidebarPanelWidth" :min="180" :max="500"></wt-splitter>

		<!-- ============================================================
		     CENTER — upper (BPMN diagram) + lower (instances / tasks)
		     ============================================================ -->
		<div class="content-main">

			<!-- Upper: BPMN viewer -->
			<div class="content-upper island p-0">
				<div class="upper-header">
					<span class="upper-title">
						<i class="bi bi-diagram-3 me-2"></i>
						<span v-if="selectedDef">{{ (selectedDef.name || selectedDef.key) + ' v' + selectedDef.version }}</span>
						<span v-else>{{ t('app.bpm-console.diagram.selectDefinition', undefined, 'Select a process definition') }}</span>
					</span>
				</div>

				<!-- Empty state -->
				<div v-if="!selectedDef" class="bpm-empty-state">
					<i class="bi bi-diagram-3"></i>
					<span>{{ t('app.bpm-console.diagram.selectDefinitionHint', undefined, 'Select a process definition to view details') }}</span>
				</div>

				<!-- Loading state -->
				<div v-if="selectedDef && !bpmnXml && isLoading" class="bpm-empty-state">
					<wt-spinner size="lg"></wt-spinner>
					<span>{{ t('app.bpm-console.diagram.loadingBpmn', undefined, 'Loading BPMN...') }}</span>
				</div>

				<!-- BPMN Diagram View -->
				<div v-if="selectedDef && bpmnModel && viewMode === 'diagram'"
					class="bpm-diagram-container"
					ref="bpmDiagramContainer"
					:class="{ 'panning-mode': spacePressed || diagramPanning }"
					@wheel="onDiagramWheel"
					@mousedown="onDiagramPanStart"
					@mousemove="onDiagramPanMove"
					@mouseup="onDiagramPanEnd"
					@mouseleave="onDiagramPanEnd">
					<svg class="bpm-diagram-svg">
						<defs>
							<!-- Grid patterns -->
							<pattern id="viewer-grid-small" width="10" height="10" patternUnits="userSpaceOnUse">
								<path d="M 10 0 L 0 0 0 10" fill="none" stroke="var(--canvas-grid-color, var(--bpm-diagram-grid))" stroke-width="0.5" opacity="0.5"/>
							</pattern>
							<pattern id="viewer-grid-large" width="100" height="100" patternUnits="userSpaceOnUse">
								<rect width="100" height="100" fill="url(#viewer-grid-small)"/>
								<path d="M 100 0 L 0 0 0 100" fill="none" stroke="var(--canvas-grid-color, var(--bpm-diagram-grid))" stroke-width="1"/>
							</pattern>
							<!-- Arrow markers (sequence flow + highlighted variant for activity history) -->
							<marker id="viewer-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth">
								<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--connection-stroke)"/>
							</marker>
							<marker id="viewer-arrow-highlight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth">
								<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bpm-diagram-highlight)"/>
							</marker>
						</defs>

						<!-- Transform Group -->
						<g :transform="'translate(' + diagramPanX + ',' + diagramPanY + ') scale(' + diagramZoom + ')'">

						<!-- Grid -->
						<rect class="canvas-grid" x="-5000" y="-5000" width="10000" height="10000" fill="url(#viewer-grid-large)"/>

						<!-- Pools -->
						<g v-for="el in viewerPools" :key="el.id"
							class="bpmn-element pool"
							:transform="'translate(' + el.x + ',' + el.y + ')'">
							<rect class="element-shape pool-shape" x="0" y="0" :width="el.width" :height="el.height"/>
							<rect class="pool-header" x="0" y="0" width="30" :height="el.height"/>
							<text class="pool-label"
								:transform="'translate(15, ' + (el.height / 2) + ') rotate(-90)'"
								text-anchor="middle" dominant-baseline="middle">{{ el.name || t('app.bpm-console.diagram.poolLabel', undefined, 'Pool') }}</text>
						</g>

						<!-- Lanes -->
						<g v-for="el in viewerLanes" :key="el.id"
							class="bpmn-element lane"
							:transform="'translate(' + el.x + ',' + el.y + ')'">
							<rect class="lane-area" x="30" y="0" :width="el.width - 30" :height="el.height"/>
							<rect class="lane-header" x="0" y="0" width="30" :height="el.height"/>
							<text class="lane-label"
								:transform="'translate(15, ' + (el.height / 2) + ') rotate(-90)'"
								text-anchor="middle" dominant-baseline="middle">{{ el.name || t('app.bpm-console.diagram.laneLabel', undefined, 'Lane') }}</text>
						</g>

						<!-- Connections -->
						<g v-for="conn in bpmnModel.connections" :key="conn.id"
							class="bpmn-connection"
							:class="[conn.connectionType === 'dataAssociation' ? 'data-association' : '', conn.connectionType === 'association' ? 'association' : '', { 'bpm-d-highlighted': highlightedConnectionIds[conn.id] }]">
							<path class="connection-line"
								:d="getViewerConnectionPath(conn)"
								:stroke-dasharray="conn.connectionType === 'dataAssociation' ? '5,3' : (conn.connectionType === 'association' ? '3,3' : 'none')"
								:marker-end="conn.connectionType === 'association' ? '' : (highlightedConnectionIds[conn.id] ? 'url(#viewer-arrow-highlight)' : 'url(#viewer-arrow)')"/>
							<g v-if="conn.name" class="connection-label-group"
								:transform="'translate(' + getViewerConnectionLabelPos(conn).x + ',' + getViewerConnectionLabelPos(conn).y + ')'">
								<foreignObject
									:x="-(conn.labelWidth || 80) / 2"
									y="-10"
									:width="conn.labelWidth || 80"
									height="100"
									class="label-foreign-object">
									<div class="connection-label-text">{{ conn.name }}</div>
								</foreignObject>
							</g>
						</g>

						<!-- Elements -->
						<g v-for="el in viewerElements" :key="el.id"
							class="bpmn-element"
							:class="[el.type, { 'bpm-d-highlighted': highlightedNodeIds[el.id], 'bpm-d-active-node': activeNodeIds[el.id], 'bpm-d-clickable': isClickableElement(el.type), 'bpm-d-diagram-selected': diagramFilterElementId === el.id, 'bpm-d-incident': incidentsByActivityId[el.id] > 0 }]"
							:transform="'translate(' + el.x + ',' + el.y + ')'"
							@click.stop="onDiagramElementClick(el)">

							<!-- Start Event -->
							<g v-if="el.type === 'startEvent'" class="start-event">
								<circle class="element-shape event-shape" cx="18" cy="18" r="18"/>
								<use v-if="el.subType === 'message'" class="event-icon message-icon" :href="spriteUrl + '#canvas-start-message'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'timer'" class="event-icon timer-icon" :href="spriteUrl + '#canvas-start-timer'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'conditional'" class="event-icon conditional-icon" :href="spriteUrl + '#canvas-start-conditional'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'signal'" class="event-icon signal-icon" :href="spriteUrl + '#canvas-start-signal'" x="0" y="0" width="36" height="36"/>
								<foreignObject v-if="el.name" x="-32" y="40" width="100" height="40" class="label-foreign-object">
									<div class="event-label-text">{{ el.name }}</div>
								</foreignObject>
							</g>

							<!-- End Event -->
							<g v-if="el.type === 'endEvent'" class="end-event">
								<circle class="element-shape event-shape" cx="18" cy="18" r="18" stroke-width="3"/>
								<use v-if="el.subType === 'message'" class="event-icon message-icon" :href="spriteUrl + '#canvas-end-message'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'terminate'" class="event-icon terminate-icon" :href="spriteUrl + '#canvas-end-terminate'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'error'" class="event-icon error-icon" :href="spriteUrl + '#canvas-end-error'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'escalation'" class="event-icon escalation-icon" :href="spriteUrl + '#canvas-end-escalation'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'signal'" class="event-icon signal-icon" :href="spriteUrl + '#canvas-end-signal'" x="0" y="0" width="36" height="36"/>
								<foreignObject v-if="el.name" x="-32" y="40" width="100" height="40" class="label-foreign-object">
									<div class="event-label-text">{{ el.name }}</div>
								</foreignObject>
							</g>

							<!-- Intermediate Event -->
							<g v-if="el.type === 'intermediateEvent'" class="intermediate-event">
								<circle class="element-shape event-shape" cx="18" cy="18" r="18"/>
								<circle cx="18" cy="18" r="14" fill="none" stroke="var(--element-stroke)" stroke-width="1"/>
								<use v-if="el.subType === 'message' && el.catching !== false" class="event-icon message-icon" :href="spriteUrl + '#canvas-intermediate-message-catch'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'message' && el.catching === false" class="event-icon message-icon" :href="spriteUrl + '#canvas-intermediate-message-throw'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'timer'" class="event-icon timer-icon" :href="spriteUrl + '#canvas-intermediate-timer'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'conditional'" class="event-icon conditional-icon" :href="spriteUrl + '#canvas-intermediate-conditional'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'signal' && el.catching !== false" class="event-icon signal-icon" :href="spriteUrl + '#canvas-intermediate-signal-catch'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'signal' && el.catching === false" class="event-icon signal-icon" :href="spriteUrl + '#canvas-intermediate-signal-throw'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'link' && el.catching !== false" class="event-icon link-icon" :href="spriteUrl + '#canvas-intermediate-link-catch'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'link' && el.catching === false" class="event-icon link-icon" :href="spriteUrl + '#canvas-intermediate-link-throw'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'escalation' && el.catching !== false" class="event-icon escalation-icon" :href="spriteUrl + '#canvas-intermediate-escalation-catch'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'escalation' && el.catching === false" class="event-icon escalation-icon" :href="spriteUrl + '#canvas-intermediate-escalation-throw'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'compensation' && el.catching !== false" class="event-icon compensation-icon" :href="spriteUrl + '#canvas-intermediate-compensation-catch'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'compensation' && el.catching === false" class="event-icon compensation-icon" :href="spriteUrl + '#canvas-intermediate-compensation-throw'" x="0" y="0" width="36" height="36"/>
								<foreignObject v-if="el.name" x="-32" y="40" width="100" height="40" class="label-foreign-object">
									<div class="event-label-text">{{ el.name }}</div>
								</foreignObject>
							</g>

							<!-- Boundary Event -->
							<g v-if="el.type === 'boundaryEvent'" class="boundary-event">
								<circle class="element-shape event-shape" cx="18" cy="18" r="18"
									:stroke-dasharray="el.cancelActivity === false ? '4,2' : 'none'"/>
								<circle cx="18" cy="18" r="14" fill="none" stroke="var(--element-stroke)" stroke-width="1"
									:stroke-dasharray="el.cancelActivity === false ? '4,2' : 'none'"/>
								<use v-if="el.subType === 'message'" class="event-icon message-icon" :href="spriteUrl + '#canvas-boundary-message'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'timer'" class="event-icon timer-icon" :href="spriteUrl + '#canvas-intermediate-timer'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'conditional'" class="event-icon conditional-icon" :href="spriteUrl + '#canvas-intermediate-conditional'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'signal'" class="event-icon signal-icon" :href="spriteUrl + '#canvas-boundary-signal'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'error'" class="event-icon error-icon" :href="spriteUrl + '#canvas-boundary-error'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'escalation'" class="event-icon escalation-icon" :href="spriteUrl + '#canvas-boundary-escalation'" x="0" y="0" width="36" height="36"/>
								<use v-if="el.subType === 'compensation'" class="event-icon compensation-icon" :href="spriteUrl + '#canvas-boundary-compensation'" x="0" y="0" width="36" height="36"/>
								<foreignObject v-if="el.name" x="-32" y="40" width="100" height="40" class="label-foreign-object">
									<div class="event-label-text">{{ el.name }}</div>
								</foreignObject>
							</g>

							<!-- User Task -->
							<g v-if="el.type === 'userTask'" class="user-task">
								<rect class="element-shape task-shape" x="0" y="0" :width="el.width" :height="el.height"/>
								<use class="element-icon" :href="spriteUrl + '#canvas-task-user'" x="0" y="0" :width="el.width" :height="el.height"/>
								<foreignObject x="5" y="28" :width="el.width - 10" :height="el.height - 36" class="label-foreign-object">
									<div class="task-label-text">{{ el.name }}</div>
								</foreignObject>
							</g>

							<!-- Service Task -->
							<g v-if="el.type === 'serviceTask'" class="service-task">

			<div class="mt-3">
				<label class="dialog-label">{{ t('app.bpm-console.dialog.targetVersion', undefined, 'Target version') }}</label>
				<wt-select style="width: 12rem" v-model="dialog.data.targetId" :items="targetVersionItems"
					@change="onTargetVersionChange"></wt-select>
			</div>

			<div class="mt-3">
				<label class="d-inline-flex align-items-center gap-2" style="cursor:pointer">
					<input type="checkbox" class="wt"
						v-model="dialog.data.mapEqualActivities"
						@change="loadMigrationPlan">
					<span>{{ t('app.bpm-console.dialog.mapEqualActivities', undefined, 'Map activities by ID (mapEqualActivities)') }}</span>
				</label>
				<br>
				<label class="d-inline-flex align-items-center gap-2 mt-1" style="cursor:pointer">
					<input type="checkbox" class="wt"
						v-model="dialog.data.updateEventTriggers"
						@change="loadMigrationPlan">
					<span>{{ t('app.bpm-console.dialog.updateEventTriggers', undefined, 'Update event triggers (timers, message subscriptions)') }}</span>
				</label>
				<br>
				<label class="d-inline-flex align-items-center gap-2 mt-1" style="cursor:pointer">
					<input type="checkbox" class="wt" v-model="dialog.data.skipCustomListeners">
					<span>{{ t('app.bpm-console.dialog.skipCustomListeners', undefined, 'Skip custom execution listeners') }}</span>
				</label>
				<br>
				<label class="d-inline-flex align-items-center gap-2 mt-1" style="cursor:pointer">
					<input type="checkbox" class="wt" v-model="dialog.data.skipIoMappings">
					<span>{{ t('app.bpm-console.dialog.skipIoMappings', undefined, 'Skip BPMN I/O mappings') }}</span>
				</label>
			</div>

			<!-- Plan preview -->
			<div class="mt-3">
				<label class="dialog-label">{{ t('app.bpm-console.dialog.migrationPlanPreview', undefined, 'Migration plan preview') }}</label>
				<div v-if="dialog.data.planLoading" class="dialog-help-text">
					<i class="bi bi-hourglass-split me-1"></i>{{ t('app.bpm-console.dialog.buildingPlan', undefined, 'Building plan…') }}
				</div>
				<div v-else-if="dialog.data.planError" class="dialog-help-text" style="color: var(--wt-danger, #c33);">
					<i class="bi bi-exclamation-triangle me-1"></i>{{ dialog.data.planError }}
				</div>
				<div v-else-if="dialog.data.plan">
					<table class="wt-table" style="width:100%; font-size: 0.85em;">
						<thead>
							<tr>
								<th>{{ t('app.bpm-console.dialog.sourceActivity', undefined, 'Source activity') }}</th>
								<th></th>
								<th>{{ t('app.bpm-console.dialog.targetActivity', undefined, 'Target activity') }}</th>
								<th title="updateEventTrigger"><i class="bi bi-stopwatch"></i></th>
							</tr>
						</thead>
						<tbody>
							<tr v-for="(inst, idx) in dialog.data.plan.instructions" :key="idx">
								<td><code>{{ inst.sourceActivityIds.join(', ') }}</code></td>
								<td><i class="bi bi-arrow-right"></i></td>
								<td><code>{{ inst.targetActivityIds.join(', ') }}</code></td>
								<td>
									<i v-if="inst.updateEventTrigger" class="bi bi-check2"></i>
								</td>
							</tr>
							<tr v-if="dialog.data.plan.instructions.length === 0">
								<td colspan="4" class="dialog-help-text">
									<i class="bi bi-info-circle me-1"></i>
									{{ t('app.bpm-console.dialog.noMappings', undefined, 'No mappings produced. All currently-active activities of the source are absent from the target — the migration will fail validation.') }}
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

			<p class="dialog-help-text mt-3">
				<i class="bi bi-info-circle me-1"></i>
				{{ t('app.bpm-console.dialog.migrateHelp', { version: dialog.data.source.version }, 'The engine queues an async migration batch covering all active instances of v{version}. Progress is shown after submit.') }}
			</p>
		</template>
		<template v-slot:footer="d">
			<button class="wt" @click="closeDialog">{{ t('common.cancel', undefined, 'Cancel') }}</button>
			<button
				class="wt wt-primary"
				:disabled="dialog.data.submitting || dialog.data.planLoading || dialog.data.countLoading || !dialog.data.migratableCount || !dialog.data.plan || dialog.data.plan.instructions.length === 0"
				@click="executeMigrate">
				<i class="bi bi-arrow-right-circle me-1"></i>
				<span v-if="dialog.data.submitting">{{ t('app.bpm-console.dialog.submitting', undefined, 'Submitting…') }}</span>
				<span v-else>{{ t('app.bpm-console.dialog.migrate', undefined, 'Migrate') }}</span>
			</button>
		</template>
	</wt-dialog>

	<!-- ===== Error Dialog =====
	     Declared after every other dialog: all wt-dialog overlays share the
	     same z-index, so DOM order is what keeps the notice painted on top
	     (the role .dialog-overlay-message used to play). -->
	<wt-dialog :open="!!errorMessage" size="sm" @close="errorMessage = ''">
		<template v-slot:title="d">
			<i class="bi bi-exclamation-triangle-fill me-2"></i>{{ t('app.bpm-console.dialog.notice', undefined, 'Notice') }}
		</template>
		<template v-slot="d">
			<p class="mt-0 mb-0">{{ errorMessage }}</p>
		</template>
		<template v-slot:footer="d">
			<button class="wt wt-primary" @click="errorMessage = ''">{{ t('common.ok', undefined, 'OK') }}</button>
		</template>
	</wt-dialog>

	<!-- ===== Migration Progress Overlay =====
		 Shown after Migrate is submitted. Driven by the
		 `jobProgress(jobId: <batchId>)` GraphQL subscription published by the
		 server as the engine drains the Camunda batch. Stays visible until
		 completion / failure; auto-closes 1.5s after success. -->
	<div v-if="migrationMonitor" class="migration-overlay flex-column text-center">
		<i v-if="migrationMonitor.status === 'failed'"
			class="bi bi-exclamation-triangle migration-icon-error"></i>
		<i v-else-if="migrationMonitor.isFinished"
			class="bi bi-check2-circle migration-icon-success"></i>
		<wt-spinner v-else size="lg"></wt-spinner>

		<div class="mt-3 migration-title">
			<span v-if="migrationMonitor.status === 'failed'">{{ t('app.bpm-console.migration.failed', undefined, 'Migration failed') }}</span>
			<span v-else-if="migrationMonitor.status === 'aborted'">{{ t('app.bpm-console.migration.aborted', undefined, 'Migration aborted') }}</span>
			<span v-else-if="migrationMonitor.isFinished">{{ t('app.bpm-console.migration.completed', undefined, 'Migration completed') }}</span>
			<span v-else-if="migrationMonitor.isUnreachable">{{ t('app.bpm-console.migration.background', undefined, 'Migration running in background') }}</span>
			<span v-else>{{ t('app.bpm-console.migration.inProgress', undefined, 'Migrating instances…') }}</span>
		</div>

		<div class="dialog-help-text mt-1">
			<span>{{ migrationMonitor.sourceLabel }}</span>
			<i class="bi bi-arrow-right mx-2"></i>
			<span>{{ migrationMonitor.targetLabel }}</span>
		</div>

		<div class="mt-3" v-if="migrationMonitor.jobsTotal > 0">
			{{ t('app.bpm-console.migration.jobsProgress', { completed: migrationMonitor.jobsCompleted, total: migrationMonitor.jobsTotal }, '{completed} / {total} jobs') }}
			<span v-if="!migrationMonitor.isFinished && !migrationMonitor.isUnreachable" class="ms-2 text-muted">
				({{ Math.round(migrationMonitor.jobsCompleted / migrationMonitor.jobsTotal * 100) }}%)
			</span>
		</div>

		<div v-if="migrationMonitor.isUnreachable && !migrationMonitor.isFinished"
			class="dialog-help-text mt-2" style="max-width: 28rem;">
			<i class="bi bi-info-circle me-1"></i>
			{{ t('app.bpm-console.migration.backgroundHelp', undefined, 'The Job Executor is processing the batch on the server. Live progress is unavailable — refresh the definition list later to verify completion.') }}
		</div>

		<div v-if="migrationMonitor.errorMessage" class="mt-3" style="color: var(--wt-danger, #c33); max-width: 32rem;">
			<i class="bi bi-exclamation-circle me-1"></i>{{ migrationMonitor.errorMessage }}
		</div>

		<div class="dialog-help-text mt-2">
			{{ t('app.bpm-console.migration.jobIdLabel', { id: migrationMonitor.jobId }, 'Job ID: {id}') }}
		</div>

		<!-- Abort button is gated on the server's `abortable` flag. Camunda 7
		     migrations report `abortable: false` because the underlying batch
		     cannot be safely cancelled mid-flight, so the button stays hidden
		     for migrations; the rendering hook is here so other JobManager
		     job types that opt in to abort can reuse this overlay. -->
		<div class="mt-3"
			v-if="migrationMonitor.abortable && !migrationMonitor.isFinished && !migrationMonitor.isUnreachable">
			<button type="button" class="wt" @click="abortMigration">{{ t('app.bpm-console.migration.abort', undefined, 'Abort') }}</button>
		</div>

		<div class="mt-3" v-if="migrationMonitor.isFinished || migrationMonitor.isUnreachable">
			<button type="button" class="wt" @click="closeMigrationMonitor">{{ t('common.close', undefined, 'Close') }}</button>
		</div>
	</div>

	</template>
	<!-- /Readiness gate -->
</div>

<script type="module" src="./app.js?v=__BUILD_VERSION__"></script>
</body>

</html>
