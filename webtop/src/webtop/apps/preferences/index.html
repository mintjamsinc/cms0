<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
	<title>Preferences</title>

	<!-- Bootstrap Icons (bundled with webtop; see webtop/rollup.config.js) -->
	<link rel="stylesheet" href="../../vendor/bootstrap-icons/bootstrap-icons.min.css?v=__BUILD_VERSION__">

	<!-- Default CSS -->
	<link href="./assets/css/style.css?v=__BUILD_VERSION__" rel="stylesheet" />
	<link href="../../assets/css/webtop-app.css?v=__BUILD_VERSION__" rel="stylesheet" />
</head>

<body>
	<div id="app" v-cloak class="d-flex flex-column" @mounted="onMounted" @unmount="onUnmount"
		@dragover.prevent="onAppDragOver" @drop.prevent>

		<!-- Readiness gate: the screen is compiled only after appLaunch() has
		     loaded the component templates and flipped isReady, so every <wt-*>
		     element is connected with its <template> already present. A
		     <template> fragment (not a wrapper <div>) keeps #app's flex layout
		     unchanged; the gated markup is intentionally not re-indented. -->
		<template v-if="isReady">

		<!-- Top Toolbar (translucent) -->
		<nav class="nav-bar window-drag-region">
			<!-- Left: section icons -->
			<div class="toolbar-group">
				<button class="btn-icon section-toggle" :class="{active: section === 'appearance'}"
					@click="selectSection('appearance')" :title="t('app.preferences.nav.appearance')">
					<i class="bi bi-palette"></i>
				</button>
				<button class="btn-icon section-toggle" :class="{active: section === 'localization'}"
					@click="selectSection('localization')" :title="t('app.preferences.nav.localization')">
					<i class="bi bi-globe2"></i>
				</button>
				<button class="btn-icon section-toggle" :class="{active: section === 'profile'}"
					@click="selectSection('profile')" :title="t('app.preferences.nav.profile')">
					<i class="bi bi-person-circle"></i>
				</button>
				<button class="btn-icon section-toggle" :class="{active: section === 'security'}"
					@click="selectSection('security')" :title="t('app.preferences.nav.security')">
					<i class="bi bi-shield-lock"></i>
				</button>
				<button class="btn-icon section-toggle" :class="{active: section === 'sessions'}"
					@click="selectSection('sessions')" :title="t('app.preferences.nav.sessions')">
					<i class="bi bi-layout-text-window-reverse"></i>
				</button>
			</div>

			<span class="nav-spacer"></span>

			<!-- Right: Window Controls -->
			<div class="window-controls">
				<button class="btn-icon" @click="onMinimizeWindow" :title="t('common.minimize')">
					<i class="bi bi-dash-lg"></i>
				</button>
				<button class="btn-icon" @click="onToggleMaximizeWindow" :title="t('common.maximize')">
					<i class="bi bi-square"></i>
				</button>
				<button class="btn-icon window-control-close" @click="onCloseWindow" :title="t('common.close')">
					<i class="bi bi-x-lg"></i>
				</button>
			</div>
		</nav>

		<!-- Content body (single pane) -->
		<div class="content-body">
			<div class="content-main island"
				@dragover.prevent.stop="onForbiddenDragOver" @drop.prevent.stop>

				<!-- Remote update notice -->
				<div v-if="remoteUpdateNotice" class="remote-notice">
					<i class="bi bi-info-circle me-2"></i>
					<span class="flex-grow-1">{{ t('app.preferences.remoteNotice') }}</span>
					<button type="button" class="btn-icon" @click="remoteUpdateNotice = false" :title="t('app.preferences.dismiss')">
						<i class="bi bi-x-lg"></i>
					</button>
				</div>

				<div class="pref-pane">

					<!-- ========== Appearance ========== -->
					<template v-if="section === 'appearance'">
						<h2 class="pref-section-title">{{ t('app.preferences.appearance.title') }}</h2>

						<!-- Theme -->
						<div class="property-group">
							<div class="property-group-title">{{ t('app.preferences.appearance.theme') }}</div>
							<div class="d-flex gap-3 mt-2">
								<label class="pref-theme-option" :class="{ selected: theme === 'light' }">
									<input type="radio" name="theme" value="light" v-model="theme"
										@change="onThemeChange" class="d-none">
									<div class="pref-theme-preview pref-theme-preview-light">
										<i class="bi bi-sun"></i>
									</div>
									<span class="pref-theme-label">{{ t('app.preferences.appearance.themeLight') }}</span>
								</label>
								<label class="pref-theme-option" :class="{ selected: theme === 'dark' }">
									<input type="radio" name="theme" value="dark" v-model="theme"
										@change="onThemeChange" class="d-none">
									<div class="pref-theme-preview pref-theme-preview-dark">
										<i class="bi bi-moon-stars"></i>
									</div>
									<span class="pref-theme-label">{{ t('app.preferences.appearance.themeDark') }}</span>
								</label>
								<label class="pref-theme-option" :class="{ selected: theme === 'auto' }">
									<input type="radio" name="theme" value="auto" v-model="theme"
										@change="onThemeChange" class="d-none">
									<div class="pref-theme-preview pref-theme-preview-auto">
										<i class="bi bi-clock-history"></i>
									</div>
									<span class="pref-theme-label">{{ t('app.preferences.appearance.themeAuto') }}</span>
								</label>
							</div>
							<div v-if="theme === 'auto'" class="text-muted mt-3">
								<i class="bi bi-info-circle me-1"></i>
								{{ t('app.preferences.appearance.themeAutoHint') }}
							</div>
						</div>

						<!-- Wallpaper -->
						<div class="property-group">
							<div class="property-group-title">{{ t('app.preferences.appearance.wallpaper') }}</div>

							<!-- Drop area: current preview + catalog -->
							<div class="pref-drop-area"
								:class="{ 'drag-over': wallpaperDragOver }"
								@dragenter.prevent.stop="onWallpaperDragEnter"
								@dragover.prevent.stop="onWallpaperDragOver"
								@dragleave.prevent.stop="onWallpaperDragLeave"
								@drop.prevent.stop="onWallpaperDrop">

								<!-- Current wallpaper preview -->
								<div v-if="currentWallpaperURL" class="pref-wallpaper-current">
									<img :src="currentWallpaperURL" alt="Current wallpaper" class="pref-wallpaper-preview-img">
								</div>

								<!-- Wallpaper catalog -->
								<div class="pref-wallpaper-catalog mt-3">
									<div v-for="wp in wallpaperCatalog" :key="wp.id"
										class="pref-wallpaper-thumb" :class="{ selected: wp.id === selectedWallpaperID }"
										@click="selectWallpaper(wp.id)">
										<img :src="wp.url + '?t=' + wp.timestamp" :alt="wp.id">
										<div v-if="wp.id === selectedWallpaperID" class="pref-wallpaper-check">
											<i class="bi bi-check-lg"></i>
										</div>
										<button v-if="wp.id !== 'default' && wp.id !== selectedWallpaperID"
											class="pref-wallpaper-delete"
											@click.stop="deleteWallpaper(wp.id)"
											:title="t('common.delete')">
											<i class="bi bi-x"></i>
										</button>
									</div>

									<!-- Upload button -->
									<div class="pref-wallpaper-thumb pref-wallpaper-upload"
										@click="triggerWallpaperUpload" :title="t('app.preferences.appearance.uploadWallpaper')">
										<i class="bi bi-plus-lg"></i>
									</div>
									<input type="file" ref="wallpaperFileInput" accept="image/*"
										@change="onWallpaperFileSelected" class="d-none">
								</div>

								<div class="pref-drop-hint">
									<i class="bi bi-cloud-upload me-1"></i>
									{{ t('app.preferences.appearance.wallpaperDropHint') }}
								</div>
							</div>
						</div>
					</template>

					<!-- ========== Localization ========== -->
					<template v-if="section === 'localization'">
						<h2 class="pref-section-title">{{ t('app.preferences.localization.title') }}</h2>

						<div class="d-flex flex-column gap-3">
							<wt-field class="pref-select"
								:label="t('app.preferences.localization.language.title')"
								:hint="t('app.preferences.localization.language.desc')">
								<wt-select v-model="locale" :items="localeItems" @change="onLocalizationChange"></wt-select>
							</wt-field>

							<wt-field class="pref-select"
								:label="t('app.preferences.localization.timezone.title')"
								:hint="t('app.preferences.localization.timezone.desc')">
								<wt-select v-model="timezone" :items="timezoneItems" @change="onLocalizationChange"></wt-select>
							</wt-field>

							<wt-field class="pref-select"
								:label="t('app.preferences.localization.numberFormat.title')"
								:hint="t('app.preferences.localization.numberFormat.desc')">
								<wt-select v-model="numberFormat" :items="numberFormatItems" @change="onLocalizationChange"></wt-select>
							</wt-field>

							<wt-field class="pref-select"
								:label="t('app.preferences.localization.currency.title')"
								:hint="t('app.preferences.localization.currency.desc')">
								<wt-select v-model="currency" :items="currencyItems" @change="onLocalizationChange"></wt-select>
							</wt-field>

							<wt-inline-message v-if="localizationMessage"
								:type="localizationMessageType === 'success' ? 'success' : 'error'">
								{{ localizationMessage }}
							</wt-inline-message>
						</div>
					</template>

					<!-- ========== Profile ========== -->
					<template v-if="section === 'profile'">
						<h2 class="pref-section-title">{{ t('app.preferences.profile.title') }}</h2>

						<!-- Avatar -->
						<div class="property-group">
							<div class="property-group-title">{{ t('app.preferences.profile.photo') }}</div>
							<div class="pref-drop-area pref-avatar-drop"
								:class="{ 'drag-over': avatarDragOver }"
								@dragenter.prevent.stop="onAvatarDragEnter"
								@dragover.prevent.stop="onAvatarDragOver"
								@dragleave.prevent.stop="onAvatarDragLeave"
								@drop.prevent.stop="onAvatarDrop">
								<div class="d-flex align-items-center gap-4">
									<div class="pref-avatar-container">
										<img v-if="avatarURL" :src="avatarURL" alt="Avatar" class="pref-avatar-img">
										<div v-else class="pref-avatar-placeholder">
											<i class="bi bi-person"></i>
										</div>
									</div>
									<div class="flex-grow-1">
										<button class="wt wt-outlined wt-slim" @click="triggerAvatarUpload">
											<i class="bi bi-upload me-1"></i>{{ t('app.preferences.profile.uploadPhoto') }}
										</button>
										<button v-if="avatarURL" class="wt wt-outlined wt-slim ms-2" @click="removeAvatar"
											:disabled="profileSaving">
											<i class="bi bi-trash3 me-1"></i>{{ t('app.preferences.profile.removePhoto') }}
										</button>
										<input type="file" ref="avatarFileInput" accept="image/png,image/jpeg,image/gif"
											@change="onAvatarFileSelected" class="d-none">
										<div class="text-muted fs-small mt-2">{{ t('app.preferences.profile.photoHint') }}</div>
									</div>
								</div>
								<div class="pref-drop-hint">
									<i class="bi bi-cloud-upload me-1"></i>
									{{ t('app.preferences.profile.photoDropHint') }}
								</div>
							</div>
						</div>

						<!-- Display Name -->
						<div class="property-group">
							<wt-field :label="t('app.preferences.profile.displayName')">
								<div class="d-flex gap-2 align-items-center">
									<input type="text" class="wt pref-input" v-model="displayName"
										:placeholder="t('app.preferences.profile.displayNamePlaceholder')">
									<button class="wt wt-primary" @click="saveDisplayName"
										:disabled="!displayNameChanged || profileSaving">
										{{ t('common.save') }}
									</button>
								</div>
							</wt-field>
							<wt-inline-message v-if="profileMessage" class="mt-2"
								:type="profileMessageType === 'success' ? 'success' : 'error'">
								{{ profileMessage }}
							</wt-inline-message>
						</div>
					</template>

					<!-- ========== Security ========== -->
					<template v-if="section === 'security'">
						<h2 class="pref-section-title">{{ t('app.preferences.security.title') }}</h2>

						<div class="property-group">
							<div class="property-group-title mb-2">{{ t('app.preferences.security.changePassword') }}</div>
							<div class="pref-form">
								<wt-field :label="t('app.preferences.security.currentPassword')">
									<input type="password" class="wt w-100"
										v-model="passwordForm.current" autocomplete="current-password">
								</wt-field>
								<wt-field :label="t('app.preferences.security.newPassword')">
									<input type="password" class="wt w-100"
										v-model="passwordForm.newPassword" autocomplete="new-password">
								</wt-field>
								<wt-field :label="t('app.preferences.security.confirmPassword')">
									<input type="password" class="wt w-100"
										v-model="passwordForm.confirm" autocomplete="new-password">
								</wt-field>
								<div class="d-flex gap-2 mt-1">
									<button class="wt wt-primary" @click="changePassword"
										:disabled="!canChangePassword || passwordSaving">
										{{ t('app.preferences.security.changePassword') }}
									</button>
								</div>
								<wt-inline-message v-if="passwordMessage"
									:type="passwordMessageType === 'success' ? 'success' : 'error'">
									{{ passwordMessage }}
								</wt-inline-message>
							</div>
						</div>

						<!-- Two-step verification (TOTP) -->
						<div class="property-group">
							<div class="property-group-title mb-2">{{ t('app.preferences.security.totp.title') }}</div>
							<div class="text-muted fs-small mb-3">{{ t('app.preferences.security.totp.desc') }}</div>
							<div v-if="securityLoading" class="text-muted fs-small">{{ t('common.loading') }}</div>
							<template v-else-if="security">
								<div class="pref-factor-row">
									<div class="pref-factor-status" :class="{ on: security.totpEnabled }">
										<i :class="['bi', security.totpEnabled ? 'bi-shield-fill-check' : 'bi-shield']"></i>
										<span>{{ security.totpEnabled ? t('app.preferences.security.totp.on') : t('app.preferences.security.totp.off') }}</span>
									</div>
									<div class="pref-factor-actions">
										<button v-if="!security.totpEnabled" class="wt wt-primary" @click="startTotpEnrollment" :disabled="securityBusy">
											{{ t('app.preferences.security.totp.turnOn') }}
										</button>
										<button v-else class="wt wt-outlined wt-danger-outline" @click="askDisableTotp" :disabled="securityBusy">
											{{ t('app.preferences.security.totp.turnOff') }}
										</button>
									</div>
								</div>
								<div v-if="security.totpEnabled" class="pref-factor-row pref-factor-sub">
									<div>
										<div>{{ t('app.preferences.security.backupCodes.title') }}</div>
										<div class="text-muted fs-small">
											{{ t('app.preferences.security.backupCodes.remaining', { count: security.backupCodesRemaining }) }}
											<span v-if="security.backupCodesRemaining <= 2" class="text-warning ms-1">
												<i class="bi bi-exclamation-triangle-fill me-1"></i>{{ t('app.preferences.security.backupCodes.low') }}
											</span>
										</div>
									</div>
									<div class="pref-factor-actions">
										<button class="wt wt-outlined wt-slim" @click="askRegenerateBackupCodes" :disabled="securityBusy">
											<i class="bi bi-arrow-repeat me-1"></i>{{ t('app.preferences.security.backupCodes.regenerate') }}
										</button>
									</div>
								</div>
							</template>
							<wt-inline-message v-if="securityMessage" class="mt-2"
								:type="securityMessageType === 'success' ? 'success' : 'error'">
								{{ securityMessage }}
							</wt-inline-message>
						</div>

						<!-- Passkeys -->
						<div class="property-group">
							<div class="property-group-title mb-2">{{ t('app.preferences.security.passkeys.title') }}</div>
							<div class="text-muted fs-small mb-3">{{ t('app.preferences.security.passkeys.desc') }}</div>
							<template v-if="security">
								<div v-if="!security.passkeysAvailable" class="text-muted fs-small">
									<i class="bi bi-info-circle me-1"></i>{{ t('app.preferences.security.passkeys.unavailable') }}
								</div>
								<div v-else-if="!webauthnSupported" class="text-muted fs-small">
									<i class="bi bi-info-circle me-1"></i>{{ t('app.preferences.security.passkeys.unsupported') }}
								</div>
								<template v-else>
									<div v-if="security.passkeys.length === 0" class="text-muted fs-small mb-3">
										{{ t('app.preferences.security.passkeys.empty') }}
									</div>
									<div v-else class="pref-passkey-list mb-3">
										<div v-for="pk in security.passkeys" :key="pk.id" class="pref-passkey-item">
											<div class="pref-passkey-icon"><i class="bi bi-key-fill"></i></div>
											<div class="pref-passkey-meta">
												<div class="pref-passkey-name">
													{{ pk.displayName || t('app.preferences.security.passkeys.unnamed') }}
													<span v-if="pk.backedUp" class="pref-passkey-badge" :title="t('app.preferences.security.passkeys.backedUpHint')">
														<i class="bi bi-cloud-check me-1"></i>{{ t('app.preferences.security.passkeys.backedUp') }}
													</span>
												</div>
												<div class="text-muted fs-small">
													{{ t('app.preferences.security.passkeys.created') }}: {{ pk.created ? formatDate(pk.created) : '—' }}
													<span class="ms-2">{{ t('app.preferences.security.passkeys.lastUsed') }}: {{ pk.lastUsed ? formatDate(pk.lastUsed) : t('app.preferences.security.passkeys.neverUsed') }}</span>
												</div>
											</div>
											<div class="pref-factor-actions">
												<button class="btn-icon" @click="askRenamePasskey(pk)" :title="t('app.preferences.security.passkeys.rename')" :disabled="securityBusy">
													<i class="bi bi-pencil"></i>
												</button>
												<button class="btn-icon pref-passkey-delete" @click="askDeletePasskey(pk)" :title="t('app.preferences.security.passkeys.delete')" :disabled="securityBusy">
													<i class="bi bi-trash3"></i>
												</button>
											</div>
										</div>
									</div>
									<button class="wt wt-primary" @click="startPasskeyRegistration" :disabled="securityBusy">
										<i class="bi bi-plus-lg me-1"></i>{{ t('app.preferences.security.passkeys.add') }}
									</button>
								</template>
							</template>
						</div>
					</template>

					<!-- ========== Sessions ========== -->
					<template v-if="section === 'sessions'">
						<h2 class="pref-section-title">{{ t('app.preferences.sessions.title') }}</h2>

						<div class="property-group">
							<div class="property-group-title">{{ t('app.preferences.sessions.saved') }}</div>
							<div v-if="sessionsLoading" class="text-muted mt-2">{{ t('common.loading') }}</div>
							<div v-else-if="sessionList.length === 0" class="text-muted mt-2">{{ t('app.preferences.sessions.empty') }}</div>
							<div v-else class="pref-session-list mt-2">
								<div v-for="s in sessionList" :key="s.id" class="pref-session-item">
									<div class="pref-session-meta">
										<div class="pref-session-name text-truncate">{{ s.displayName }}</div>
										<div class="pref-session-date text-muted">{{ formatDate(s.savedAt) }}</div>
									</div>
									<button class="btn-icon pref-session-delete"
										@click="confirmDeleteSession(s)" :title="t('common.delete')">
										<i class="bi bi-trash3"></i>
									</button>
								</div>
							</div>
							<wt-inline-message v-if="sessionMessage" class="mt-2"
								:type="sessionMessageType === 'success' ? 'success' : 'error'">
								{{ sessionMessage }}
							</wt-inline-message>
						</div>
					</template>

				</div>
			</div>
		</div>

		<!-- Bottom Status Bar (translucent, empty — same shape as editor apps) -->
		<div class="status-bar window-drag-region"></div>

		<!-- Confirmation Dialog -->
		<wt-dialog v-model:open="confirmDialog.visible" size="sm" @close="closeConfirmDialog">
			<template v-slot:title="d">
				<i :class="['bi', 'me-2', confirmDialog.iconClass || 'bi-question-circle']"></i>{{ confirmDialog.title }}
			</template>
			<template v-slot="d">
				<p class="mt-0 mb-0">{{ confirmDialog.message }}</p>
			</template>
			<template v-slot:footer="d">
				<button class="wt" @click="closeConfirmDialog">{{ t('common.cancel') }}</button>
				<button class="wt"
					:class="confirmDialog.danger ? 'wt-danger' : 'wt-primary'"
					@click="acceptConfirmDialog">
					{{ confirmDialog.confirmLabel || t('common.ok') }}
				</button>
			</template>
		</wt-dialog>

		<!-- Password prompt (re-authentication before a security change) -->
		<wt-dialog v-model:open="passwordPrompt.visible" size="sm" @close="closePasswordPrompt">
			<template v-slot:title="d">
				<i class="bi bi-shield-lock me-2"></i>{{ passwordPrompt.title }}
			</template>
			<template v-slot="d">
				<p class="mt-0 mb-3">{{ passwordPrompt.message }}</p>
				<wt-field :label="t('app.preferences.security.currentPassword')">
					<input type="password" class="wt w-100" v-model="passwordPrompt.password"
						autocomplete="current-password" @keydown="onPasswordPromptKeydown">
				</wt-field>
				<wt-inline-message v-if="passwordPrompt.error" type="error" class="mt-2">{{ passwordPrompt.error }}</wt-inline-message>
			</template>
			<template v-slot:footer="d">
				<button class="wt" @click="closePasswordPrompt">{{ t('common.cancel') }}</button>
				<button class="wt" :class="passwordPrompt.danger ? 'wt-danger' : 'wt-primary'"
					@click="submitPasswordPrompt" :disabled="!passwordPrompt.password || passwordPrompt.busy">
					{{ passwordPrompt.confirmLabel }}
				</button>
			</template>
		</wt-dialog>

		<!-- TOTP enrollment: scan, then confirm with a first code -->
		<wt-dialog v-model:open="totpDialog.visible" size="sm" @close="closeTotpDialog">
			<template v-slot:title="d">
				<i class="bi bi-qr-code me-2"></i>{{ t('app.preferences.security.totp.setupTitle') }}
			</template>
			<template v-slot="d">
				<p class="mt-0 mb-3">{{ t('app.preferences.security.totp.setupStep1') }}</p>
				<div class="pref-qr" v-html="totpDialog.qrSvg"></div>
				<div class="pref-secret">
					<div class="text-muted fs-small">{{ t('app.preferences.security.totp.manualEntry') }}</div>
					<code class="pref-secret-value">{{ totpDialog.secretGrouped }}</code>
				</div>
				<p class="mb-2">{{ t('app.preferences.security.totp.setupStep2') }}</p>
				<wt-field :label="t('app.preferences.security.totp.code')">
					<input type="text" class="wt w-100 pref-code-input" v-model="totpDialog.code" inputmode="numeric"
						autocomplete="one-time-code" placeholder="000000" maxlength="7" @keydown="onTotpDialogKeydown">
				</wt-field>
				<wt-inline-message v-if="totpDialog.error" type="error" class="mt-2">{{ totpDialog.error }}</wt-inline-message>
			</template>
			<template v-slot:footer="d">
				<button class="wt" @click="closeTotpDialog">{{ t('common.cancel') }}</button>
				<button class="wt wt-primary" @click="confirmTotpEnrollment" :disabled="!totpDialog.code || totpDialog.busy">
					{{ t('app.preferences.security.totp.activate') }}
				</button>
			</template>
		</wt-dialog>

		<!-- Backup codes (shown once) -->
		<wt-dialog v-model:open="codesDialog.visible" size="sm" @close="closeCodesDialog">
			<template v-slot:title="d">
				<i class="bi bi-key me-2"></i>{{ t('app.preferences.security.backupCodes.title') }}
			</template>
			<template v-slot="d">
				<p class="mt-0 mb-3">{{ t('app.preferences.security.backupCodes.intro') }}</p>
				<div class="pref-codes">
					<code v-for="c in codesDialog.codes" :key="c" class="pref-code">{{ c }}</code>
				</div>
				<div class="d-flex gap-2 mt-3">
					<button class="wt wt-outlined wt-slim" @click="copyBackupCodes">
						<i class="bi bi-clipboard me-1"></i>{{ t('app.preferences.security.backupCodes.copy') }}
					</button>
					<button class="wt wt-outlined wt-slim" @click="downloadBackupCodes">
						<i class="bi bi-download me-1"></i>{{ t('app.preferences.security.backupCodes.download') }}
					</button>
				</div>
				<wt-inline-message v-if="codesDialog.message" type="success" class="mt-2">{{ codesDialog.message }}</wt-inline-message>
			</template>
			<template v-slot:footer="d">
				<button class="wt wt-primary" @click="closeCodesDialog">{{ t('app.preferences.security.backupCodes.saved') }}</button>
			</template>
		</wt-dialog>

		<!-- Passkey name (after registration, and rename) -->
		<wt-dialog v-model:open="passkeyNameDialog.visible" size="sm" @close="closePasskeyNameDialog">
			<template v-slot:title="d">
				<i class="bi bi-key-fill me-2"></i>{{ passkeyNameDialog.title }}
			</template>
			<template v-slot="d">
				<p v-if="passkeyNameDialog.message" class="mt-0 mb-3">{{ passkeyNameDialog.message }}</p>
				<wt-field :label="t('app.preferences.security.passkeys.name')">
					<input type="text" class="wt w-100" v-model="passkeyNameDialog.name" maxlength="64"
						:placeholder="t('app.preferences.security.passkeys.namePlaceholder')" @keydown="onPasskeyNameKeydown">
				</wt-field>
				<wt-inline-message v-if="passkeyNameDialog.error" type="error" class="mt-2">{{ passkeyNameDialog.error }}</wt-inline-message>
			</template>
			<template v-slot:footer="d">
				<button class="wt" @click="closePasskeyNameDialog">{{ passkeyNameDialog.cancelLabel }}</button>
				<button class="wt wt-primary" @click="submitPasskeyName" :disabled="!passkeyNameDialog.name.trim() || passkeyNameDialog.busy">
					{{ t('common.save') }}
				</button>
			</template>
		</wt-dialog>

		<!-- Notification Dialog -->
		<wt-dialog v-model:open="notificationDialog.visible" size="sm" @close="closeNotificationDialog">
			<template v-slot:title="d">
				<i :class="['bi', 'me-2', notificationIconClass()]"></i>{{ notificationDialog.title }}
			</template>
			<template v-slot="d">
				<p class="mt-0 mb-0">{{ notificationDialog.message }}</p>
			</template>
			<template v-slot:footer="d">
				<button class="wt wt-primary" @click="closeNotificationDialog">{{ t('common.ok') }}</button>
			</template>
		</wt-dialog>

		</template>
		<!-- /Readiness gate -->
	</div>

	<script type="module" src="./app.js?v=__BUILD_VERSION__"></script>
</body>
</html>
