<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
	<title>Text Editor</title>
	<!-- The document <title> is intentionally left as a static literal: it is
	     the browser/tab title, not app chrome, and is replaced by the shell. -->


	<!-- Bootstrap Icons (bundled with webtop; see webtop/rollup.config.js) -->
	<link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css?v=__BUILD_VERSION__">

	<!-- Default CSS -->
	<link href="./assets/css/style.css?v=__BUILD_VERSION__" rel="stylesheet" />
	<link href="../../assets/css/webtop-app.css?v=__BUILD_VERSION__" rel="stylesheet" />
	<link rel="stylesheet" href="../../components/wt-inspector.css?v=__BUILD_VERSION__">
</head>

<body>
	<div id="app" class="d-flex flex-column"
		:class="{ 'is-resizing': sidebarResizing }"
		@mounted="onMounted" @unmount="onUnmount"
		@dragover.prevent="onAppDragOver" @drop.prevent>

		<!-- Readiness gate: the screen is compiled only after appLaunch() has
		     loaded the component templates and flipped isReady, so every <wt-*>
		     element is connected with its <template> already present. A
		     <template> fragment (not a wrapper <div>) keeps #app's flex layout
		     unchanged; the gated markup is intentionally not re-indented. -->
		<template v-if="isReady">

		<!-- Top Toolbar (translucent) -->
		<nav class="nav-bar window-drag-region">
			<!-- Left: file actions -->
			<div class="toolbar-group">
				<button class="btn-icon" @click="saveFile"
					:disabled="!currentFile.path || !currentFile.isModified || isSaving"
					:title="t('app.text-editor.toolbar.save', undefined, 'Save (Ctrl+S)')">
					<i class="bi bi-floppy"></i>
				</button>
				<button class="btn-icon" @click="openSaveAsDialog" :disabled="isSaving"
					:title="t('app.text-editor.toolbar.saveAs', undefined, 'Save As...')">
					<i class="bi bi-floppy2"></i>
				</button>
			</div>

			<!-- Left: undo/redo -->
			<div class="toolbar-group">
				<button class="btn-icon" @click="undo" :disabled="!canUndo"
					:title="t('app.text-editor.toolbar.undo', undefined, 'Undo (Ctrl+Z)')">
					<i class="bi bi-arrow-counterclockwise"></i>
				</button>
				<button class="btn-icon" @click="redo" :disabled="!canRedo"
					:title="t('app.text-editor.toolbar.redo', undefined, 'Redo (Ctrl+Y)')">
					<i class="bi bi-arrow-clockwise"></i>
				</button>
			</div>

			<!-- Left: editor view options -->
			<div class="toolbar-group">
				<button class="btn-icon" :class="{active: lineWrap}" @click="toggleLineWrap"
					:title="lineWrap ? t('app.text-editor.toolbar.wordWrapOn', undefined, 'Word Wrap: On — wrap at right edge') : t('app.text-editor.toolbar.wordWrapOff', undefined, 'Word Wrap: Off — horizontal scroll')">
					<i class="bi bi-text-wrap"></i>
				</button>
			</div>

			<span class="nav-spacer"></span>

			<!-- Right: Preview toggle (own group) -->
			<div class="pane-toggles">
				<button class="btn-icon pane-toggle-btn" :class="{active: previewOpen}"
					@click="togglePreviewPanel" :title="t('app.text-editor.toolbar.openPreview', undefined, 'Open Preview Window')">
					<i class="bi bi-window"></i>
				</button>
			</div>

			<!-- Right: Pane Toggles -->
			<div class="pane-toggles">
				<button class="btn-icon pane-toggle-btn" :class="{active: sidebarPanelVisible}"
					@click="toggleSidebarPanel" :title="t('app.text-editor.toolbar.toggleSidebar', undefined, 'Toggle Sidebar')">
					<i class="bi bi-layout-sidebar-inset"></i>
				</button>
				<button class="btn-icon pane-toggle-btn" :class="{active: detailPanelVisible}"
					@click="toggleDetailPanel" :title="t('app.text-editor.toolbar.toggleInspector', undefined, 'Toggle Inspector (Ctrl+I)')">
					<i class="bi bi-layout-sidebar-inset-reverse"></i>
				</button>
			</div>

			<!-- Right: Window Controls -->
			<div class="window-controls">
				<button class="btn-icon" @click="onMinimizeWindow" :title="t('common.minimize', undefined, 'Minimize')">
					<i class="bi bi-dash-lg"></i>
				</button>
				<button class="btn-icon" @click="onToggleMaximizeWindow" :title="t('common.maximize', undefined, 'Maximize')">
					<i class="bi bi-square"></i>
				</button>
				<button class="btn-icon window-control-close" @click="onCloseWindow" :title="t('common.close', undefined, 'Close')">
					<i class="bi bi-x-lg"></i>
				</button>
			</div>
		</nav>

		<!-- Content body (3-pane) -->
		<div class="content-body">

			<!-- Left pane: search / replace -->
			<div v-if="sidebarPanelVisible" class="sidebar-panel island"
				:style="{ width: sidebarPanelWidth + 'px' }"
				@dragover.prevent.stop="onForbiddenDragOver" @drop.prevent.stop>
				<div class="sidebar-panel-content">
					<div class="sidebar-section">
						<div class="sidebar-section-body px-2">
							<wt-find-replace v-model="searchTerm" v-model:replace="replaceTerm"
								v-model:case-sensitive="searchCaseSensitive"
								v-model:whole-word="searchWholeWord"
								v-model:regex="searchRegex"
								:focus-seq="searchFocusSeq"
								:labels="findReplaceLabels"
								@change="onSearchTermInput"
								@find-next="findNextMatch" @find-prev="findPrev"
								@replace="replaceCurrent" @replace-all="replaceAllInDoc"
								@escape="focusEditor">
								<template v-slot:status="s">
									<span v-if="searchNotFound" class="text-warning"><i class="bi bi-exclamation-circle me-1"></i>{{ t('app.text-editor.find.noMatches', undefined, 'No matches') }}</span>
								</template>
							</wt-find-replace>
						</div>
					</div>
				</div>
			</div>

			<!-- Sidebar resize handle -->
			<wt-splitter v-if="sidebarPanelVisible" v-model:size="sidebarPanelWidth" :min="180" :max="600"
				@resize-start="sidebarResizing = true" @resize-end="sidebarResizing = false"></wt-splitter>

			<!-- Center pane: editor -->
			<!-- @drop uses .capture so we intercept file drops before CodeMirror's
			     inner handler pastes the text/plain payload (the dragged path). -->
			<div class="content-main island p-0"
				@dragover.prevent.stop="onCenterPaneDragOver" @drop.capture="onCenterPaneDrop">

				<!-- Header: file tabs -->
				<wt-file-tabs :model-value="currentFileIndex" :items="fileTabItems"
					:add-title="t('app.text-editor.tabs.newFile', undefined, 'New file')"
					:close-title="t('common.close', undefined, 'Close')"
					@select="selectTab($event.detail)"
					@close="closeFile($event.detail)"
					@add="newFile"></wt-file-tabs>

				<!-- Body: editor -->
				<div class="editor-area">
					<div id="editor-container" ref="editorContainer"></div>
				</div>
			</div>

			<!-- Detail Resize Handle -->
			<wt-splitter v-if="detailPanelVisible" reverse v-model:size="detailPanelWidth"
				:min="detailPanelMinWidth" :max="detailPanelMaxWidth"
				@resize-end="persistDetailPanelState"></wt-splitter>

			<!-- Inspector Panel — wt-inspector custom element. Targets the active
			     tab's file. The host owns panel visibility (detailPanelVisible)
			     and width (detailPanelWidth); the inspector handles everything
			     inside. -->
			<wt-inspector v-if="detailPanelVisible"
				:target="inspectorTarget"
				:api="inspectorApi"
				:view-options="inspectorOptions"
				:width="detailPanelWidth"
				:localization="localization"
				@reveal-item="onInspectorRevealItem($event.detail)"
				@overlay-changed="onInspectorOverlayChanged($event.detail)"
				@content-reverted="onInspectorContentReverted($event.detail)"></wt-inspector>

		</div>

		<!-- Bottom Status Bar (translucent) -->
		<div class="status-bar window-drag-region">
			<div class="status-group">
				<span class="status-item">{{ t('app.text-editor.statusbar.lineCol', { line: cursorLine, col: cursorColumn }, 'Ln {line}, Col {col}') }}</span>
				<span class="status-divider"></span>
				<span class="status-item">{{ currentFile.encoding || 'UTF-8' }}</span>
				<span class="status-divider"></span>
				<span class="status-item">{{ currentFile.mimeType || 'text/plain' }}</span>
			</div>
			<span class="nav-spacer"></span>
			<div class="status-group">
				<span v-if="isSaving" class="status-item"><wt-spinner size="sm" class="me-1"></wt-spinner>{{ t('app.text-editor.statusbar.saving', undefined, 'Saving...') }}</span>
				<span v-else-if="currentFile.isModified" class="status-item">{{ t('app.text-editor.statusbar.modified', undefined, 'Modified') }}</span>
				<span v-else class="status-item">{{ t('app.text-editor.statusbar.saved', undefined, 'Saved') }}</span>
			</div>
		</div>

		<!-- Save As Dialog -->
		<wt-dialog :open="saveAsDialog.visible" size="sm" :title="t('app.text-editor.saveAs.title', undefined, 'Save As')" @close="closeSaveAsDialog">
			<template v-slot="d">
				<label class="dialog-label">{{ t('app.text-editor.saveAs.fileName', undefined, 'File Name') }}</label>
				<input type="text" class="wt w-100" v-model="saveAsDialog.fileName"
					placeholder="filename.txt" @keydown.enter="closeSaveAsDialog" />
				<div class="save-as-chip-area mt-3"
					@dragover.prevent.stop="onForbiddenDragOver" @drop.prevent.stop>
					<div class="save-as-chip" draggable="true" @dragstart="onSaveAsDragStart">
						<i class="bi bi-file-earmark-text me-1"></i>
						<span>{{ saveAsDialog.fileName || 'untitled.txt' }}</span>
					</div>
					<p class="text-muted fs-small mt-2 mb-0">
						{{ t('app.text-editor.saveAs.dragHint', undefined, 'Drag this file to Content Browser to save') }}
					</p>
				</div>
			</template>
		</wt-dialog>

		<!-- Loading Overlay -->
		<wt-spinner v-if="currentFile.isLoading" overlay size="lg"></wt-spinner>

		<!-- Error Overlay -->
		<div v-if="errorMessage && !currentFile.isLoading" class="error-overlay flex-column text-center">
			<i class="bi bi-exclamation-triangle-fill text-warning fs-2 mb-3"></i>
			<span class="mb-3">{{ errorMessage }}</span>
			<button type="button" class="wt" @click="dismissError">{{ t('common.close', undefined, 'Close') }}</button>
		</div>

		<!-- Checkout Confirmation Dialog — no ✕ / Escape: the choice is explicit. -->
		<wt-dialog :open="checkoutDialog.visible" :closable="false" :esc-close="false">
			<template v-slot:title="d">
				<i class="bi bi-box-arrow-up-right me-2"></i>{{ t('app.text-editor.checkout.title', undefined, 'Checkout Required') }}
			</template>
			<template v-slot="d">
				<p>{{ t('app.text-editor.checkout.message', undefined, 'This file is under version control and needs to be checked out before editing.') }}</p>
				<p class="text-muted fs-small mb-0">{{ t('app.text-editor.checkout.version', { version: currentFile.baseVersionName }, 'Version: {version}') }}</p>
			</template>
			<template v-slot:footer="d">
				<button class="wt" @click="onCheckoutDialogAction('cancel')">{{ t('common.cancel', undefined, 'Cancel') }}</button>
				<button class="wt wt-primary wt-outlined" @click="onCheckoutDialogAction('checkout')">
					<i class="bi bi-box-arrow-up-right me-1"></i>{{ t('app.text-editor.checkout.checkout', undefined, 'Checkout') }}
				</button>
				<button class="wt wt-primary" @click="onCheckoutDialogAction('checkoutAndCheckin')">
					<i class="bi bi-check2-circle me-1"></i>{{ t('app.text-editor.checkout.checkoutAndCheckin', undefined, 'Checkout & Checkin after Save') }}
				</button>
			</template>
		</wt-dialog>

		<!-- Checkin Dialog — no ✕ / Escape: the choice is explicit. -->
		<wt-dialog :open="checkinDialog.visible" :closable="false" :esc-close="false">
			<template v-slot:title="d">
				<i class="bi bi-floppy-fill me-2"></i>{{ t('app.text-editor.checkin.title', undefined, 'File Saved') }}
			</template>
			<template v-slot="d">
				<p>{{ t('app.text-editor.checkin.message', undefined, 'The file has been saved successfully. Would you like to create a new version?') }}</p>
				<p class="text-muted fs-small mb-0">{{ t('app.text-editor.checkin.currentVersion', { version: currentFile.baseVersionName }, 'Current version: {version}') }}</p>
			</template>
			<template v-slot:footer="d">
				<button class="wt" @click="closeCheckinDialog" :disabled="checkinDialog.isLoading">{{ t('app.text-editor.checkin.keepEditing', undefined, 'Keep Editing') }}</button>
				<button class="wt wt-primary wt-outlined" @click="submitCheckpoint" :disabled="checkinDialog.isLoading">
					<i class="bi bi-save me-1"></i>{{ t('app.text-editor.checkin.checkpoint', undefined, 'Checkpoint') }}
				</button>
				<button class="wt wt-primary" @click="submitCheckin" :disabled="checkinDialog.isLoading">
					<i class="bi bi-box-arrow-in-down-left me-1"></i>{{ t('app.text-editor.checkin.checkin', undefined, 'Checkin') }}
				</button>
			</template>
		</wt-dialog>

		<!-- Close Confirmation Dialog — no ✕ / Escape: the choice is explicit. -->
		<wt-dialog :open="closeConfirmDialog.visible" :closable="false" :esc-close="false">
			<template v-slot:title="d">
				<i class="bi bi-exclamation-triangle-fill me-2"></i>{{ t('app.text-editor.unsaved.title', undefined, 'Unsaved Changes') }}
			</template>
			<template v-slot="d">
				<p class="mt-0">{{ t('app.text-editor.unsaved.hasChanges', { name: currentFile.name }, 'The file "{name}" has unsaved changes.') }}</p>
				<p>{{ t('app.text-editor.unsaved.prompt', undefined, 'Do you want to save your changes before closing?') }}</p>
			</template>
			<template v-slot:footer="d">
				<button class="wt" @click="onCloseConfirmDialogAction('cancel')">{{ t('common.cancel', undefined, 'Cancel') }}</button>
				<button class="wt wt-danger" @click="onCloseConfirmDialogAction('discard')">
					<i class="bi bi-trash me-1"></i>{{ t('app.text-editor.unsaved.dontSave', undefined, "Don't Save") }}
				</button>
				<button v-if="currentFile.path" class="wt wt-primary" @click="onCloseConfirmDialogAction('save')">
					<i class="bi bi-floppy me-1"></i>{{ t('common.save', undefined, 'Save') }}
				</button>
			</template>
		</wt-dialog>

		</template>
		<!-- /Readiness gate -->
	</div>

	<script type="module" src="./app.js?v=__BUILD_VERSION__"></script>
</body>

</html>
