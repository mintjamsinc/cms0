<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
	<!--
		EIP icon sprite, shared by the modeler's palette, the modeler's canvas
		and the read-only <eip-canvas> component (copied to
		components/eip-canvas-icons.svg at build time).

		Every symbol is one glyph on the same 24x24 grid: white strokes of
		width 2 with round caps, artwork kept inside 3..21 so that all glyphs
		read as the same size. The coloured body behind the glyph (node, palette
		swatch, capsule badge) is drawn by whoever places the symbol, so one
		<use> at the same box gives the same size everywhere:

			palette swatch   18x18 in a 36x36 tile
			capsule node     22x22 centred on the badge at (25,25)
			rectangular node 32x32 centred at (30,30)
			choice diamond   24x24 centred at (50,30)
			merge diamond    24x24 centred at (25,25)

		Choice is the one exception to white: its diamond is yellow, so the
		glyph is dark.
	-->

	<!-- Basic -->

	<!-- From: arrow leaving to the right -->
	<symbol id="canvas-from" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4,12 H19 M14,7 L19,12 L14,17"/>
	</symbol>

	<!-- To: target -->
	<symbol id="canvas-to" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<circle cx="12" cy="12" r="8"/>
		<circle cx="12" cy="12" r="3" fill="white" stroke="none"/>
	</symbol>

	<!-- ToD: target whose ring is dashed - the endpoint is decided at runtime -->
	<symbol id="canvas-toD" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<circle cx="12" cy="12" r="8" stroke-dasharray="3.3 2.98"/>
		<circle cx="12" cy="12" r="3" fill="white" stroke="none"/>
	</symbol>

	<!-- Transform -->

	<!-- Log: lines of text -->
	<symbol id="canvas-log" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4,7 H20 M4,12 H20 M4,17 H13"/>
	</symbol>

	<!-- SetBody: message with its body lines -->
	<symbol id="canvas-setBody" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<rect x="4" y="4" width="16" height="16" rx="2"/>
		<path d="M8,11 H16 M8,15 H13"/>
	</symbol>

	<!-- SetHeader: message with its header band -->
	<symbol id="canvas-setHeader" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<rect x="4" y="4" width="16" height="16" rx="2"/>
		<path d="M4,9.5 H20"/>
		<rect x="5" y="5" width="14" height="4.5" fill="white" stroke="none"/>
	</symbol>

	<!-- Transform: exchange arrows -->
	<symbol id="canvas-transform" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4,8.5 H18 M14,4.5 L18,8.5 L14,12.5"/>
		<path d="M20,15.5 H6 M10,11.5 L6,15.5 L10,19.5"/>
	</symbol>

	<!-- Marshal: pack a message into a box (files that still contain one) -->
	<symbol id="canvas-marshal" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3,12 H11 M8,9 L11,12 L8,15"/>
		<rect x="14" y="6" width="7" height="12" rx="1.5"/>
	</symbol>

	<!-- Unmarshal: unpack a message out of a box -->
	<symbol id="canvas-unmarshal" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<rect x="3" y="6" width="7" height="12" rx="1.5"/>
		<path d="M13,12 H21 M18,9 L21,12 L18,15"/>
	</symbol>

	<!-- Routing -->

	<!-- Choice: question mark, dark on the yellow diamond -->
	<symbol id="canvas-choice" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M8.6,9 A3.4,3.4 0 1,1 13.4,12.1 C12.3,12.9 12,13.6 12,15"/>
		<circle cx="12" cy="18.8" r="1.4" fill="#333" stroke="none"/>
	</symbol>

	<!-- Filter: funnel -->
	<symbol id="canvas-filter" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4,5 H20 L14,12.5 V19.5 L10,17.5 V12.5 Z"/>
	</symbol>

	<!-- Split: one message cut into pieces -->
	<symbol id="canvas-split" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
		<rect x="3" y="8.5" width="6" height="7" rx="1"/>
		<path d="M9,12 H12 M12,6 V18 M12,6 H14 M12,12 H14 M12,18 H14" fill="none"/>
		<rect x="15" y="4" width="6" height="4" rx="1"/>
		<rect x="15" y="10" width="6" height="4" rx="1"/>
		<rect x="15" y="16" width="6" height="4" rx="1"/>
	</symbol>

	<!-- Aggregate: many into one -->
	<symbol id="canvas-aggregate" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4,6 L12,12 M4,12 H12 M4,18 L12,12 M12,12 H19"/>
		<circle cx="19" cy="12" r="2.2" fill="white" stroke="none"/>
	</symbol>

	<!-- Multicast: one source broadcasting -->
	<symbol id="canvas-multicast" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<circle cx="6" cy="12" r="2.5" fill="white" stroke="none"/>
		<path d="M11,7 A7,7 0 0,1 11,17"/>
		<path d="M14.5,3.5 A11.5,11.5 0 0,1 14.5,20.5"/>
	</symbol>

	<!-- RecipientList: fan out to listed recipients -->
	<symbol id="canvas-recipientList" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3,12 H8 M8,12 L15,6 M8,12 H15 M8,12 L15,18"/>
		<circle cx="18.5" cy="6" r="2.2" fill="white" stroke="none"/>
		<circle cx="18.5" cy="12" r="2.2" fill="white" stroke="none"/>
		<circle cx="18.5" cy="18" r="2.2" fill="white" stroke="none"/>
	</symbol>

	<!-- Loop: circular arrow -->
	<symbol id="canvas-loop" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M18.2,15.5 A7,7 0 1,1 18.2,8.5"/>
		<path d="M14.5,8.5 H19 V4"/>
	</symbol>

	<!-- Merge: branches joining -->
	<symbol id="canvas-merge" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M5,6.5 L12,12 M5,17.5 L12,12 M12,12 H19"/>
	</symbol>

	<!-- Control -->

	<!-- Delay: clock -->
	<symbol id="canvas-delay" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<circle cx="12" cy="12" r="8"/>
		<path d="M12,7.5 V12 L15,14.5"/>
	</symbol>

	<!-- Throttle: gauge -->
	<symbol id="canvas-throttle" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4,17 A8,8 0 0,1 20,17"/>
		<path d="M12,17 L16,10.5"/>
		<circle cx="12" cy="17" r="1.8" fill="white" stroke="none"/>
	</symbol>

	<!-- Bean: coffee bean -->
	<symbol id="canvas-bean" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<g transform="rotate(35 12 12)">
			<ellipse cx="12" cy="12" rx="5.5" ry="8.5"/>
			<path d="M12,4.5 C9.5,8 14.5,16 12,19.5" stroke-width="1.6"/>
		</g>
	</symbol>

	<!-- Threads: parallel rails -->
	<symbol id="canvas-threads" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4,7 H20 M4,12 H20 M4,17 H20"/>
		<circle cx="7" cy="7" r="2.2" fill="white" stroke="none"/>
		<circle cx="7" cy="12" r="2.2" fill="white" stroke="none"/>
		<circle cx="7" cy="17" r="2.2" fill="white" stroke="none"/>
	</symbol>

	<!-- CircuitBreaker: an open switch in a line -->
	<symbol id="canvas-circuitBreaker" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3,14 H7 M17,14 H21 M8,14 L15.5,8"/>
		<circle cx="8" cy="14" r="1.8" fill="white" stroke="none"/>
		<circle cx="16" cy="14" r="1.8" fill="white" stroke="none"/>
	</symbol>

	<!-- Stop: square -->
	<symbol id="canvas-stop" viewBox="0 0 24 24" fill="white" stroke="none">
		<rect x="6" y="6" width="12" height="12" rx="1.5"/>
	</symbol>

	<!-- Integration -->

	<!-- WireTap: a tap off the line -->
	<symbol id="canvas-wireTap" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3,8 H21"/>
		<path d="M12,8 V15" stroke-dasharray="2.5 2.2"/>
		<circle cx="12" cy="18" r="2.5" fill="white" stroke="none"/>
	</symbol>

	<!-- Enrich: add to the message in flight -->
	<symbol id="canvas-enrich" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3,12 H6.5 M17.5,12 H21"/>
		<circle cx="12" cy="12" r="5.5"/>
		<path d="M12,9.5 V14.5 M9.5,12 H14.5"/>
	</symbol>

	<!-- PollEnrich: pull a message in -->
	<symbol id="canvas-pollEnrich" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M12,4 V14 M8,10.5 L12,14.5 L16,10.5"/>
		<path d="M4,16.5 V20 H20 V16.5"/>
	</symbol>

	<!-- Error handling -->

	<!-- onException: exclamation mark -->
	<symbol id="canvas-onException" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M12,5 V13.5"/>
		<circle cx="12" cy="18.2" r="1.7" fill="white" stroke="none"/>
	</symbol>

	<!-- doTry: shield -->
	<symbol id="canvas-doTry" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M12,3 L19,5.5 V11 C19,15.6 16.1,19.2 12,21 C7.9,19.2 5,15.6 5,11 V5.5 Z"/>
	</symbol>

	<!-- onCompletion: done -->
	<symbol id="canvas-onCompletion" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<circle cx="12" cy="12" r="8"/>
		<path d="M8.5,12.3 L11,14.8 L15.8,9.5"/>
	</symbol>
</svg>
