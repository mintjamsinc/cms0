identifier: 3a3c1d5e-6f0b-4b8e-9d2a-7c41e8f05b96
title: Pomodoro
icon: assets/icons/icon.svg
# Pomodoro timer: focus, a short break, and after a few rounds a long one,
# with a pixel-art houseplant that grows with the minutes focused. The
# `timer` widget (widget.html next to this descriptor) keeps the timer above
# the windows; the window holds the plant, the record and the settings. The
# timer's state is kept per user under /home/users/<user>/pomodoro/ in the
# system workspace and shared by the widget, the window and other browsers.
# During focus a mix of the Ambience app can play.
actions:
  open:
    icon: open
    label: Open
minimumWidth: 720
minimumHeight: 560
customWindowControls: true
# One window per desktop: a second launch focuses the running one.
singleton: true
widgets:
  timer:
    title: Pomodoro
    entry: widget.html
    width: 280
    height: 148
    resizable: false
    multiple: false
    layer: pinned
