    <path d="M 90 32 C 78 20 64 24 62 30 C 72 36 84 36 90 32 Z" fill="#66bb6a"/>
    <path d="M 90 30 C 102 16 118 20 120 27 C 110 34 98 34 90 30 Z" fill="#4caf50"/>
