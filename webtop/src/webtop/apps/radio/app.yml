identifier: 5b7c2f1e-8a4d-4c3b-9e21-7f0a6d3c9b58
title: Radio
icon: assets/icons/icon.svg
# Internet radio player. Streams are played by the browser's <audio> element
# straight from the station (Icecast / SHOUTcast MP3, AAC, Ogg); a plain-http
# station on an https desktop is relayed by stream.groovy instead. Station
# discovery uses the public Radio Browser directory; favorites, recently
# played stations and manually added stations are kept per user under
# /home/users/<user>/radio/ in the system workspace. The "now playing" track
# title comes from the ICY metadata stream, read by icy.groovy next to this
# descriptor because browsers cannot read it themselves.
actions:
  open:
    icon: open
    label: Open
minimumWidth: 1000
minimumHeight: 620
customWindowControls: true
# One player per desktop: a second launch focuses the running one instead of
# starting a second stream.
singleton: true
