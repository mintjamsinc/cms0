identifier: 2f830e12-fdc1-437a-a712-813755037fa3
title: Number Place
category: games
icon: assets/icons/icon.svg
# Number Place (sudoku) alone, against the computer (time attack or
# territory), or with another user of the Webtop: solving one board
# together, or against each other over the network. Puzzles are made in
# gen-worker.js next to app.js. The window is a lobby, where the next game
# is set up, or the game itself; the players' panel stays beside both. The
# game in progress and the settings are kept per user in the local webtop
# database.
actions:
  open:
    icon: open
    label: Open
minimumWidth: 760
minimumHeight: 600
customWindowControls: true
# The saved game is per user, so a second launch focuses the running one.
singleton: true
