<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sticky notes">
  <defs>
    <clipPath id="clip-sticky"><rect x="0" y="0" width="180" height="180" rx="42" ry="42"/></clipPath>
    <linearGradient id="hl-sticky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <defs><linearGradient id="bg-sticky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f59e0b"/>
    <stop offset="100%" stop-color="#ea580c"/>
  </linearGradient></defs>
  <rect x="0" y="0" width="180" height="180" rx="42" ry="42" fill="url(#bg-sticky)"/>
  <g clip-path="url(#clip-sticky)">
    <!-- Back note, tilted -->
    <g transform="rotate(-9 90 90)">
      <rect x="52" y="40" width="80" height="80" rx="8" fill="#fde68a" opacity="0.85"/>
    </g>
    <!-- Front note with a folded corner -->
    <path d="M 46 58 H 126 V 116 L 108 134 H 46 Z" fill="#fff7cc"/>
    <path d="M 126 116 L 108 116 L 108 134 Z" fill="#f4d97a"/>
    <g stroke="#b45309" stroke-linecap="round" stroke-width="6" stroke-opacity="0.55">
      <line x1="60" y1="78" x2="112" y2="78"/>
      <line x1="60" y1="96" x2="104" y2="96"/>
      <line x1="60" y1="114" x2="88" y2="114"/>
    </g>
  </g>
  <g clip-path="url(#clip-sticky)">
    <rect x="0" y="0" width="180" height="180" fill="url(#hl-sticky)"/>
    <rect x="0.5" y="0.5" width="179" height="179" rx="41.5" ry="41.5"
          fill="none" stroke="white" stroke-opacity="0.18" stroke-width="1"/>
  </g>
</svg>
