<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
	<title>Dashboard</title>

	<!-- Bootstrap Icons (bundled with webtop) -->
	<link rel="stylesheet" href="../../vendor/bootstrap-icons/bootstrap-icons.min.css?v=__BUILD_VERSION__">

	<!-- App CSS + shared Webtop design system -->
	<link href="./assets/css/style.css?v=__BUILD_VERSION__" rel="stylesheet" />
	<link href="../../assets/css/webtop-app.css?v=__BUILD_VERSION__" rel="stylesheet" />
</head>

<body>
	<div id="app" v-cloak class="d-flex flex-column" @mounted="onMounted" @unmount="onUnmount">

		<!-- Readiness gate: the screen is compiled only after appLaunch() has
		     loaded the component templates and flipped isReady, so every <wt-*>
		     element is connected with its <template> already present. A
		     <template> fragment (not a wrapper <div>) keeps #app's flex layout
		     unchanged; the gated markup is intentionally not re-indented. -->
		<template v-if="isReady">

		<!-- Top toolbar -->
		<nav class="nav-bar window-drag-region">
			<div class="toolbar-group">
				<button class="btn-icon" @click="refresh" :disabled="refreshing" :title="t('app.dashboard.toolbar.refresh', undefined, 'Refresh')">
					<wt-spinner v-if="refreshing" size="sm"></wt-spinner>
					<i v-else class="bi bi-arrow-clockwise"></i>
				</button>
			</div>

			<span class="dash-greeting" v-if="view === 'ready'">{{ greeting }}</span>

			<wt-live-indicator :connected="connected"
				:on-label="t('app.dashboard.live.live', undefined, 'Live')"
				:off-label="t('app.dashboard.live.offline', undefined, 'Offline')"
				:on-title="t('app.dashboard.live.on', undefined, 'Live updates on')"
				:off-title="t('app.dashboard.live.off', undefined, 'Live updates off')"></wt-live-indicator>

			<span class="nav-spacer"></span>

			<!-- Window controls -->
			<div class="window-controls">
				<button class="btn-icon" @click="onMinimizeWindow" :title="t('app.dashboard.window.minimize', undefined, 'Minimize')">
					<i class="bi bi-dash-lg"></i>
				</button>
				<button class="btn-icon" @click="onToggleMaximizeWindow" :title="t('app.dashboard.window.maximize', undefined, 'Maximize')">
					<i class="bi bi-square"></i>
				</button>
				<button class="btn-icon window-control-close" @click="onCloseWindow" :title="t('app.dashboard.window.close', undefined, 'Close')">
					<i class="bi bi-x-lg"></i>
				</button>
			</div>
		</nav>

		<!-- Loading -->
		<wt-empty-state v-if="view === 'loading'">
			<wt-spinner size="lg"></wt-spinner>
			{{ t('app.dashboard.state.loading', undefined, 'Loading dashboard…') }}
		</wt-empty-state>

		<!-- Error -->
		<wt-empty-state v-else-if="view === 'error'" icon="bi-exclamation-triangle-fill">
			{{ errorMessage }}
			<button slot="actions" class="wt" @click="refresh">{{ t('app.dashboard.action.retry', undefined, 'Retry') }}</button>
		</wt-empty-state>

		<!-- Ready -->
		<div v-else class="dash-body">

			<wt-empty-state v-if="layout.length === 0" icon="bi-grid">
				{{ t('app.dashboard.state.empty', undefined, 'There is nothing on your dashboard yet.') }}
			</wt-empty-state>

			<!-- A section per declared section that has a card the user may see.
			     What a card shows is the snapshot its provider made on the server
			     (see app.ts); the markup below draws the blocks of a snapshot and
			     knows nothing of any particular card. While a card is maximized
			     the layout holds that card alone. -->
			<section class="dash-section" v-for="section in layout" :key="section.key">
				<div class="dash-section-head">
					<i class="bi" :class="section.icon"></i>{{ section.title }}
					<span class="nav-spacer"></span>
					<button class="dash-section-toggle" v-if="section.canToggle" @click="toggleSection(section.id)"
						:title="section.summaryOnly ? t('app.dashboard.section.showAll.hint', undefined, 'Show every card of this section') : t('app.dashboard.section.showSummary.hint', undefined, 'Show the summary only')">
						<i class="bi" :class="section.summaryOnly ? 'bi-grid-3x2-gap' : 'bi-dash-square'"></i>
						{{ section.summaryOnly ? t('app.dashboard.section.showAll', undefined, 'All cards') : t('app.dashboard.section.showSummary', undefined, 'Summary only') }}
					</button>
				</div>

				<div class="dash-grid" :class="{ 'is-maximized': section.maximized }">
					<div class="island dash-card" v-for="card in section.cards" :key="card.key" :class="card.sizeClass">
						<div class="dash-card-head has-link">
							<span class="head-title"><i class="bi" :class="card.icon"></i>{{ card.title }}</span>
							<span class="dash-card-actions">
								<button class="dash-card-link" v-if="card.canMaximize" @click="toggleMaximize(card.id)"
									:title="card.maximized ? t('app.dashboard.action.restore', undefined, 'Back to the dashboard') : t('app.dashboard.action.maximize', undefined, 'Show the details')">
									<i class="bi" :class="card.maximized ? 'bi-fullscreen-exit' : 'bi-arrows-fullscreen'"></i>
								</button>
								<button class="dash-card-link" v-if="card.link" @click="open(card.link)"
									:title="t('app.dashboard.action.open', undefined, 'Open')">
									<i class="bi bi-box-arrow-up-right"></i>
								</button>
							</span>
						</div>

						<div class="dash-list-empty" v-if="!card.loaded">
							<wt-spinner size="sm"></wt-spinner>
						</div>

						<div class="dash-columns" :class="{ 'is-split': card.columns.length > 1 }">
							<div class="dash-column" v-for="(column, ci) in card.columns" :key="ci">
								<div class="dash-block" v-for="(block, bi) in column" :key="bi">

									<div class="dash-card-head" v-if="block.title">{{ block.title }}</div>

									<!-- kpis: a strip of numbers -->
									<div class="dash-kpis" v-if="block.type === 'kpis'">
										<div class="dash-kpi" v-for="(item, ii) in block.items" :key="ii" :class="{ 'is-link': item.link }"
											@click="open(item.link)" :title="item.hint">
											<span class="dash-kpi-value" v-if="item.badge"><wt-badge :variant="item.tone">{{ item.value }}</wt-badge></span>
											<span class="dash-kpi-value" v-else :class="item.valueClass">{{ item.value }}<span class="dash-denom" v-if="item.denom">/{{ item.denom }}</span></span>
											<span class="dash-kpi-label">{{ item.label }}</span>
										</div>
									</div>

									<!-- metric: the one number the card is about -->
									<div class="dash-metric" v-else-if="block.type === 'metric'">
										<span class="dash-metric-value" :class="block.valueClass">{{ block.value }}<span class="dash-denom" v-if="block.denom">/{{ block.denom }}</span></span>
										<span class="dash-metric-unit">{{ block.unit }}</span>
									</div>

									<!-- rows: label and value -->
									<div class="dash-rows" v-else-if="block.type === 'rows'">
										<div class="dash-row" v-for="(row, ri) in block.items" :key="ri" :title="row.hint">
											<span class="dash-row-label"><i class="bi" v-if="row.icon" :class="row.icon"></i>{{ row.label }}</span>
											<wt-badge v-if="row.badge" :variant="row.tone">{{ row.value }}</wt-badge>
											<span class="dash-row-value" v-else :class="row.valueClass">{{ row.value }}</span>
										</div>
									</div>

									<!-- list: ranked or plain rows that lead somewhere -->
									<div class="dash-list" v-else-if="block.type === 'list'">
										<button class="dash-list-row" v-for="(row, ri) in block.items" :key="ri" :class="{ 'is-static': !row.link }"
											@click="open(row.link)" :title="row.hint">
											<span class="dash-list-rank"><i class="bi" v-if="row.icon" :class="row.icon"></i><span v-else>{{ row.rank }}</span></span>
											<span class="dash-list-main">
												<span class="dash-list-title">{{ row.title }}<wt-badge class="ms-1" variant="neutral" v-for="(tag, ti) in row.tags" :key="ti">{{ tag }}</wt-badge></span>
												<span class="dash-list-sub" v-if="row.sub">{{ row.sub }}</span>
											</span>
											<wt-badge v-for="(badge, gi) in row.badges" :key="gi" :variant="badge.tone" :title="badge.hint">{{ badge.text }}</wt-badge>
											<span class="dash-list-value" v-if="row.value" :class="row.valueClass">{{ row.value }}</span>
										</button>
										<div class="dash-list-empty" v-if="block.items.length === 0 && block.empty">{{ block.empty }}</div>
									</div>

									<!-- matrix: a state for every pair -->
									<div class="dash-matrix-wrap" v-else-if="block.type === 'matrix'">
										<table class="dash-matrix">
											<caption>{{ block.caption }}</caption>
											<thead>
												<tr>
													<th></th>
													<th v-for="name in block.columns" :key="name" scope="col">{{ name }}</th>
												</tr>
											</thead>
											<tbody>
												<tr v-for="row in block.rows" :key="row.label">
													<th scope="row">{{ row.label }}</th>
													<td v-for="(cell, xi) in row.cells" :key="xi" :class="'is-' + cell">
														<i class="bi bi-check-circle-fill" v-if="cell === 'ok'"></i>
														<i class="bi bi-hourglass-split" v-else-if="cell === 'warn'"></i>
														<i class="bi bi-x-circle-fill" v-else-if="cell === 'down'"></i>
														<span v-else>—</span>
													</td>
												</tr>
											</tbody>
										</table>
									</div>

									<!-- note: a sentence -->
									<div class="dash-list-empty" v-else-if="block.type === 'note'">{{ block.text }}</div>

								</div>
							</div>
						</div>
					</div>
				</div>
			</section>

		</div>

		<!-- Status bar -->
		<div class="status-bar window-drag-region">
			<div class="status-group">
				<span class="status-item">{{ isAdmin ? t('app.dashboard.statusbar.operatorView', undefined, 'Operator view') : t('app.dashboard.statusbar.myWork', undefined, 'My work') }}</span>
			</div>
			<span class="nav-spacer"></span>
			<div class="status-group">
				<span v-if="refreshing" class="status-item"><i class="bi bi-arrow-repeat me-1"></i>{{ t('app.dashboard.statusbar.refreshing', undefined, 'Refreshing…') }}</span>
				<span v-else-if="lastUpdated" class="status-item">{{ t('app.dashboard.statusbar.updated', { when: lastUpdatedLabel }, 'Updated ' + lastUpdatedLabel) }}</span>
				<span v-else class="status-item">{{ t('app.dashboard.statusbar.ready', undefined, 'Ready') }}</span>
			</div>
		</div>

		</template>
		<!-- /Readiness gate -->
	</div>

	<script type="module" src="./app.js?v=__BUILD_VERSION__"></script>
</body>

</html>
