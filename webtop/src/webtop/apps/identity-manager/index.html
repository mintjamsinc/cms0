<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
	<title>Identity Manager</title>

	<!-- Bootstrap Icons (bundled with webtop; see webtop/rollup.config.js) -->
	<link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css?v=__BUILD_VERSION__">

	<!-- Default CSS -->
	<link href="./assets/css/style.css?v=__BUILD_VERSION__" rel="stylesheet" />
	<link href="../../assets/css/webtop-app.css?v=__BUILD_VERSION__" rel="stylesheet" />
</head>

<body>
	<div id="app" v-cloak class="d-flex flex-column" @mounted="onMounted" @unmount="onUnmount">

		<!-- Readiness gate: the screen is compiled only after appLaunch() has
		     loaded the component templates and flipped isReady, so every <wt-*>
		     element is connected with its <template> already present. A
		     <template> fragment (not a wrapper <div>) keeps #app's flex layout
		     unchanged; the gated markup is intentionally not re-indented. -->
		<template v-if="isReady">

		<!-- Top Toolbar (translucent) -->
		<nav class="nav-bar window-drag-region">
			<!-- Left: section toggle (Users / Groups / Roles) -->
			<div class="toolbar-group">
				<button class="btn-icon section-toggle" :class="{active: activeSection === 'users'}"
					@click="switchSection('users')" :title="t('app.identity-manager.tab.users', undefined, 'Users')">
					<i class="bi bi-people"></i>
				</button>
				<button class="btn-icon section-toggle" :class="{active: activeSection === 'groups'}"
					@click="switchSection('groups')" :title="t('app.identity-manager.tab.groups', undefined, 'Groups')">
					<i class="bi bi-diagram-3"></i>
				</button>
				<button class="btn-icon section-toggle" :class="{active: activeSection === 'roles'}"
					@click="switchSection('roles')" :title="t('app.identity-manager.tab.roles', undefined, 'Roles')">
					<i class="bi bi-shield"></i>
				</button>
			</div>

			<!-- Left: actions (New / Refresh) -->
			<div class="toolbar-group">
				<button class="btn-icon" @click="showCreateDialog" :title="newActionTitle">
					<i class="bi bi-plus-lg"></i>
				</button>
				<button class="btn-icon" @click="refresh" :title="t('app.identity-manager.action.refresh', undefined, 'Refresh')">
					<i class="bi bi-arrow-clockwise"></i>
				</button>
			</div>

			<span class="nav-spacer"></span>

			<!-- Right: Pane Toggle -->
			<div class="pane-toggles">
				<button class="btn-icon pane-toggle-btn" :class="{active: sidebarPanelVisible}"
					@click="toggleSidebarPanel" :title="t('app.identity-manager.action.toggleSidebar', undefined, 'Toggle Sidebar')">
					<i class="bi bi-layout-sidebar-inset"></i>
				</button>
			</div>

			<!-- Right: Window Controls -->
			<div class="window-controls">
				<button class="btn-icon" @click="onMinimizeWindow" :title="t('app.identity-manager.action.minimize', undefined, 'Minimize')">
					<i class="bi bi-dash-lg"></i>
				</button>
				<button class="btn-icon" @click="onToggleMaximizeWindow" :title="t('app.identity-manager.action.maximize', undefined, 'Maximize')">
					<i class="bi bi-square"></i>
				</button>
				<button class="btn-icon window-control-close" @click="onCloseWindow" :title="t('app.identity-manager.action.close', undefined, 'Close')">
					<i class="bi bi-x-lg"></i>
				</button>
			</div>
		</nav>

		<!-- Content body (2-pane) -->
		<div class="content-body">

			<!-- Left pane: list (users / groups / roles) -->
			<div v-if="sidebarPanelVisible" class="sidebar-panel island p-0"
				:style="{ width: sidebarPanelWidth + 'px' }">

				<!-- Filter -->
				<div class="list-filter">
					<wt-search-box v-model="currentSearchQuery" :placeholder="searchPlaceholder"
						@change="onSearchInput"></wt-search-box>
				</div>

				<!-- Users list -->
				<div v-if="activeSection === 'users'" class="list-body">
					<div v-for="u in displayedUsers" :key="u.username" class="list-item"
						:class="{ selected: selectedUser && selectedUser.username === u.username }"
						@click="selectUser(u)">
						<i :class="u.isService ? 'bi bi-robot list-item-icon' : 'bi bi-person list-item-icon'"></i>
						<div class="list-item-info">
							<div class="list-item-key">{{ u.displayName || u.username }}</div>
							<div class="list-item-sub">{{ u.username }}</div>
						</div>
						<span v-if="u.isService" class="service-badge">{{ t('app.identity-manager.user.serviceBadge', undefined, 'Service') }}</span>
						<span v-if="!u.enabled" class="disabled-badge">{{ t('app.identity-manager.status.disabled', undefined, 'Disabled') }}</span>
					</div>
					<div v-if="displayedUsers.length === 0" class="list-empty-message">
						{{ t('app.identity-manager.empty.users', undefined, 'No users found') }}
					</div>
				</div>

				<!-- Groups tree -->
				<div v-if="activeSection === 'groups'" class="list-body">
					<div v-for="node in filteredGroupTree" :key="node.groupId" class="tree-node"
						:class="{
							selected: selectedGroup && selectedGroup.groupId === node.groupId,
							'search-muted': groupSearch && !node.matched
						}"
						:style="{ paddingLeft: (node.depth * 1.25 + 0.375) + 'rem' }"
						@click="selectGroup(node)">
						<span class="tree-toggle" @click.stop="toggleGroupExpand(node)">
							<i v-if="node.hasChildren && !groupSearch" class="bi"
								:class="expandedGroups[node.groupId] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
						</span>
						<i class="bi bi-diagram-2 tree-node-icon"></i>
						<span class="tree-node-label">{{ node.displayName || node.name }}</span>
					</div>
					<div v-if="filteredGroupTree.length === 0" class="list-empty-message">
						{{ t('app.identity-manager.empty.groups', undefined, 'No groups found') }}
					</div>
				</div>

				<!-- Roles tree -->
				<div v-if="activeSection === 'roles'" class="list-body">
					<div v-for="node in filteredRoleTree" :key="node.roleId" class="tree-node"
						:class="{
							selected: selectedRole && selectedRole.roleId === node.roleId,
							'search-muted': roleSearch && !node.matched
						}"
						:style="{ paddingLeft: (node.depth * 1.25 + 0.375) + 'rem' }"
						@click="selectRole(node)">
						<span class="tree-toggle" @click.stop="toggleRoleExpand(node)">
							<i v-if="node.hasChildren && !roleSearch" class="bi"
								:class="expandedRoles[node.roleId] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
						</span>
						<i class="bi bi-shield tree-node-icon"></i>
						<span class="tree-node-label">{{ node.displayName || node.name }}</span>
					</div>
					<div v-if="filteredRoleTree.length === 0" class="list-empty-message">
						{{ t('app.identity-manager.empty.roles', undefined, 'No roles found') }}
					</div>
				</div>
			</div>

			<!-- Sidebar resize handle -->
			<wt-splitter v-if="sidebarPanelVisible" v-model:size="sidebarPanelWidth" :min="180" :max="600"></wt-splitter>

			<!-- Right pane -->
			<div class="content-main island p-0">

				<!-- ============================================================
				     USERS — detail
				     ============================================================ -->
				<template v-if="activeSection === 'users'">
					<template v-if="selectedUser">
						<!-- Sub-tabs header -->
						<div class="detail-tabs-bar ps-2">
							<wt-tabs v-model="userSubTab" :items="userTabItems"></wt-tabs>
						</div>

						<!-- Body -->
						<div class="content-form">

							<!-- Profile sub-tab -->
							<template v-if="userSubTab === 'profile'">
								<div class="property-group">
									<div class="property-group-title">{{ t('app.identity-manager.user.infoTitle', undefined, 'User Information') }}</div>
									<wt-inline-message v-if="isSelf" type="info">{{ t('app.identity-manager.user.selfNote', undefined, 'This is your own account. You cannot disable it or change its roles here — manage your own profile from your account settings.') }}</wt-inline-message>
									<wt-inline-message v-if="selectedUser.isService" type="info">{{ t('app.identity-manager.user.serviceNote', undefined, 'Service account — a non-interactive identity used by integrations (via runAs). It has no password and can never sign in.') }}</wt-inline-message>
									<div class="form-row">
										<wt-field class="flex-grow-1" :label="t('app.identity-manager.field.username', undefined, 'Username')">
											<input type="text" class="wt w-100" :value="selectedUser.username" disabled>
										</wt-field>
										<wt-field class="flex-grow-1" :label="t('app.identity-manager.field.email', undefined, 'Email')">
											<input type="email" class="wt w-100" v-model="editForm.mail" :disabled="isSelf">
										</wt-field>
									</div>
									<div class="form-row">
										<wt-field class="flex-grow-1" :label="t('app.identity-manager.field.familyName', undefined, 'Family Name (sn)')">
											<input type="text" class="wt w-100" v-model="editForm.sn" :disabled="isSelf">
										</wt-field>
										<wt-field class="flex-grow-1" :label="t('app.identity-manager.field.givenName', undefined, 'Given Name')">
											<input type="text" class="wt w-100" v-model="editForm.givenName" :disabled="isSelf">
										</wt-field>
									</div>
									<div class="form-row">
										<wt-field class="flex-grow-1" :label="t('app.identity-manager.field.displayName', undefined, 'Display Name')">
											<input type="text" class="wt w-100" v-model="editForm.displayName" :disabled="isSelf">
										</wt-field>
										<wt-field class="flex-grow-1" :label="t('app.identity-manager.field.status', undefined, 'Status')">
											<wt-checkbox v-model="editForm.enabled" :disabled="isSelf"
												:label="t('app.identity-manager.status.enabled', undefined, 'Enabled')"></wt-checkbox>
										</wt-field>
									</div>
								</div>

								<div class="property-group">
									<div class="property-group-title">{{ t('app.identity-manager.section.actions', undefined, 'Actions') }}</div>
									<div class="form-actions">
										<button class="wt wt-primary" @click="saveUser" :disabled="isSelf">
											<i class="bi bi-check-lg me-1"></i>{{ t('app.identity-manager.action.save', undefined, 'Save') }}
										</button>
										<button v-if="!isProtectedSelectedUser && !isSelf" class="wt wt-danger wt-outlined" @click="confirmDeleteUser">
											<i class="bi bi-trash me-1"></i>{{ t('app.identity-manager.action.delete', undefined, 'Delete') }}
										</button>
									</div>
									<div class="timestamp-line" v-if="selectedUser.created">
										{{ t('app.identity-manager.field.created', undefined, 'Created') }}: {{ formatDate(selectedUser.created) }}<span v-if="selectedUser.lastModified"> · {{ t('app.identity-manager.field.modified', undefined, 'Modified') }}: {{ formatDate(selectedUser.lastModified) }}</span><span v-if="selectedUser.lastLogin"> · {{ t('app.identity-manager.field.lastLogin', undefined, 'Last login') }}: {{ formatDate(selectedUser.lastLogin) }}</span>
									</div>
								</div>
							</template>

							<!-- Security sub-tab -->
							<template v-if="userSubTab === 'security'">
								<div class="property-group">
									<div class="property-group-title">{{ t('app.identity-manager.user.rolesTitle', undefined, 'Roles') }}</div>
									<div v-if="allRolesFlat.length > 0" class="role-check-list">
										<wt-checkbox v-for="r in allRolesFlat" :key="r.roleId" class="role-check-row"
											:style="{ paddingLeft: (r.depth * 1.25) + 'rem' }"
											:model-value="userHasRole(r.roleId)" :disabled="isSelf"
											@change="toggleUserRole(r.roleId, $event.detail)">
											<span>{{ r.displayName || r.name }}</span>
											<span class="role-id-hint">{{ r.roleId }}</span>
										</wt-checkbox>
									</div>
									<div v-if="allRolesFlat.length === 0" class="text-muted">{{ t('app.identity-manager.empty.rolesDefined', undefined, 'No roles defined') }}</div>
									<div class="form-actions">
										<button class="wt wt-primary" @click="saveUser" :disabled="isSelf">
											<i class="bi bi-check-lg me-1"></i>{{ t('app.identity-manager.user.saveRoleChanges', undefined, 'Save Role Changes') }}
										</button>
									</div>
								</div>

								<!-- Service accounts have no password and can never sign in. -->
								<div class="property-group" v-if="!selectedUser.isService">
									<div class="property-group-title">{{ t('app.identity-manager.field.password', undefined, 'Password') }}</div>
									<div class="form-row">
										<wt-field class="flex-grow-1" :label="t('app.identity-manager.field.newPassword', undefined, 'New Password')">
											<input type="password" class="wt w-100" v-model="passwordForm.newPassword"
												:placeholder="t('app.identity-manager.field.newPasswordPlaceholder', undefined, 'New password')">
										</wt-field>
									</div>
									<div class="form-actions">
										<button class="wt wt-primary wt-outlined"
											@click="resetUserPassword"
											:disabled="!passwordForm.newPassword">
											<i class="bi bi-key me-1"></i>{{ t('app.identity-manager.action.resetPassword', undefined, 'Reset Password') }}
										</button>
									</div>
								</div>
							</template>

							<!-- Membership sub-tab -->
							<template v-if="userSubTab === 'membership'">
								<div class="property-group">
									<div class="property-group-title">{{ t('app.identity-manager.user.directMemberships', undefined, 'Direct Group Memberships') }}</div>
									<div v-if="selectedUser.memberOf && selectedUser.memberOf.length > 0" class="chip-list">
										<span v-for="g in selectedUser.memberOf" :key="g.groupId" class="chip">
											<i class="bi bi-diagram-2"></i>
											<span>{{ g.displayName || g.groupId }}</span>
											<button class="chip-remove"
												@click="removeUserFromGroup(g.groupId)" :title="t('app.identity-manager.action.remove', undefined, 'Remove')">×</button>
										</span>
									</div>
									<div v-else class="text-muted">{{ t('app.identity-manager.empty.memberships', undefined, 'No group memberships') }}</div>
								</div>

								<div class="property-group" v-if="selectedUser.effectiveGroups && selectedUser.effectiveGroups.length > 0">
									<div class="property-group-title">{{ t('app.identity-manager.user.effectiveGroups', undefined, 'Effective Groups (including ancestors)') }}</div>
									<div class="chip-list">
										<span v-for="g in selectedUser.effectiveGroups" :key="g.groupId" class="chip muted">
											<i class="bi bi-diagram-2"></i>
											<span>{{ g.displayName || g.groupId }}</span>
										</span>
									</div>
								</div>
							</template>
						</div>
					</template>
					<wt-empty-state v-else icon="bi-person-circle">{{ t('app.identity-manager.empty.selectUser', undefined, 'Select a user to view details') }}</wt-empty-state>
				</template>

				<!-- ============================================================
				     GROUPS — detail
				     ============================================================ -->
				<template v-if="activeSection === 'groups'">
					<template v-if="selectedGroup">
						<!-- Sub-tabs header -->
						<div class="detail-tabs-bar ps-2">
							<wt-tabs v-model="groupSubTab" :items="groupTabItems"></wt-tabs>
						</div>

						<!-- Body -->
						<div class="content-form">

							<!-- Info sub-tab -->
							<template v-if="groupSubTab === 'info'">
								<div class="property-group">
									<div class="property-group-title">{{ t('app.identity-manager.group.infoTitle', undefined, 'Group Information') }}</div>
									<wt-field :label="t('app.identity-manager.group.groupIdPath', undefined, 'Group ID (path)')">
										<input type="text" class="wt w-100" :value="selectedGroup.groupId" disabled>
									</wt-field>
									<div class="form-row">
										<wt-field class="flex-grow-1" :label="t('app.identity-manager.field.displayName', undefined, 'Display Name')">
											<input type="text" class="wt w-100" v-model="groupEditForm.displayName">
										</wt-field>
										<wt-field class="flex-grow-1" :label="t('app.identity-manager.field.depth', undefined, 'Depth')">
											<input type="text" class="wt w-100" :value="selectedGroup.depth" disabled>
										</wt-field>
									</div>
									<wt-field :label="t('app.identity-manager.field.description', undefined, 'Description')">
										<textarea class="wt w-100" rows="2" v-model="groupEditForm.description"></textarea>
									</wt-field>
								</div>

								<div class="property-group">
									<div class="property-group-title">{{ t('app.identity-manager.field.ancestors', undefined, 'Ancestors') }}</div>
									<div v-if="selectedGroup.ancestors && selectedGroup.ancestors.length > 0" class="chip-list">
										<span v-for="a in selectedGroup.ancestors" :key="a.groupId" class="chip muted">
											<i class="bi bi-diagram-2"></i>
											<span>{{ a.displayName || a.groupId }}</span>
										</span>
									</div>
									<div v-else class="text-muted">{{ t('app.identity-manager.group.rootLevelNote', undefined, 'This is a root-level group.') }}</div>
								</div>

								<div class="property-group">
									<div class="property-group-title">{{ t('app.identity-manager.section.actions', undefined, 'Actions') }}</div>
									<div class="form-actions">
										<button class="wt wt-primary" @click="saveGroup">
											<i class="bi bi-check-lg me-1"></i>{{ t('app.identity-manager.action.save', undefined, 'Save') }}
										</button>
										<button v-if="!isProtectedSelectedGroup" class="wt wt-danger wt-outlined" @click="confirmDeleteGroup">
											<i class="bi bi-trash me-1"></i>{{ t('app.identity-manager.action.delete', undefined, 'Delete') }}
										</button>
									</div>
									<div class="timestamp-line" v-if="selectedGroup.created">
										{{ t('app.identity-manager.field.created', undefined, 'Created') }}: {{ formatDate(selectedGroup.created) }}<span v-if="selectedGroup.lastModified"> · {{ t('app.identity-manager.field.modified', undefined, 'Modified') }}: {{ formatDate(selectedGroup.lastModified) }}</span>
									</div>
								</div>
							</template>

							<!-- Members sub-tab -->
							<template v-if="groupSubTab === 'members'">
								<div class="property-group">
									<div class="property-group-title">{{ t('app.identity-manager.group.directMembers', { count: groupMembers.length }, 'Direct Members (' + groupMembers.length + ')') }}</div>
									<div v-if="groupMembers.length > 0" class="member-list">
										<div v-for="m in groupMembers" :key="m.username" class="member-row">
											<i class="bi bi-person"></i>
											<span class="member-name">{{ m.displayName || m.username }}</span>
											<span class="member-username">{{ m.username }}</span>
											<button class="btn-icon" @click="removeGroupMember(m.username)"
												:title="t('app.identity-manager.action.removeMember', undefined, 'Remove member')">
												<i class="bi bi-x-lg"></i>
											</button>
										</div>
									</div>
									<div v-else class="text-muted">{{ t('app.identity-manager.empty.directMembers', undefined, 'No direct members') }}</div>
								</div>

								<div class="property-group">
									<div class="property-group-title">{{ t('app.identity-manager.group.addMembers', undefined, 'Add Members') }}</div>
									<div class="member-search">
										<div class="input-group">
											<input type="text" class="wt"
												v-model="memberSearchQuery"
												@input="searchMemberCandidates"
												@keydown="handleMemberSearchKeydown"
												:placeholder="t('app.identity-manager.group.memberSearchPlaceholder', undefined, 'Search by name, username, or email...')">
											<div v-if="memberSearchQuery" class="input-group-actions">
												<button class="input-group-btn" @click="clearMemberSearch" :title="t('app.identity-manager.action.clear', undefined, 'Clear')">
													<i class="bi bi-x"></i>
												</button>
											</div>
										</div>
										<div v-if="memberCandidates.length > 0" class="member-suggestions">
											<div v-for="(c, idx) in memberCandidates" :key="c.username"
												class="member-suggestion"
												:class="{
													highlighted: idx === memberHighlightIndex,
													disabled: c.alreadyMember || c.staged
												}"
												@mousedown.prevent="stageCandidate(c)">
												<i class="bi bi-person"></i>
												<div class="member-suggestion-info">
													<div class="member-suggestion-name">{{ c.displayName || c.username }}</div>
													<div class="member-suggestion-sub">
														{{ c.username }}<span v-if="c.mail"> · {{ c.mail }}</span>
													</div>
												</div>
												<span v-if="c.alreadyMember" class="member-suggestion-tag">{{ t('app.identity-manager.group.memberAdded', undefined, 'Added') }}</span>
												<span v-else-if="c.staged" class="member-suggestion-tag">{{ t('app.identity-manager.group.memberSelected', undefined, 'Selected') }}</span>
											</div>
										</div>
									</div>

									<div v-if="stagedMembers.length > 0" class="chip-list">
										<span v-for="s in stagedMembers" :key="s.username" class="chip">
											<i class="bi bi-person"></i>
											<span>{{ s.displayName || s.username }}</span>
											<button class="chip-remove" @click="unstageCandidate(s)" :title="t('app.identity-manager.action.remove', undefined, 'Remove')">×</button>
										</span>
									</div>

									<div v-if="stagedMembers.length > 0" class="form-actions">
										<button class="wt wt-primary" @click="addStagedMembers">
											<i class="bi bi-person-plus me-1"></i>{{ t('app.identity-manager.group.addNMembers', { count: stagedMembers.length }, 'Add ' + stagedMembers.length + ' Member(s)') }}
										</button>
									</div>
								</div>
							</template>
						</div>
					</template>
					<wt-empty-state v-else icon="bi-diagram-2">{{ t('app.identity-manager.empty.selectGroup', undefined, 'Select a group to view details') }}</wt-empty-state>
				</template>

				<!-- ============================================================
				     ROLES — detail
				     ============================================================ -->
				<template v-if="activeSection === 'roles'">
					<template v-if="selectedRole">
						<!-- Sub-tabs header (single tab, kept for consistency) -->
						<div class="detail-tabs-bar ps-2">
							<wt-tabs model-value="info" :items="roleTabItems"></wt-tabs>
						</div>

						<!-- Body -->
						<div class="content-form">
							<div class="property-group">
								<div class="property-group-title">{{ t('app.identity-manager.role.infoTitle', undefined, 'Role Information') }}</div>
								<wt-field :label="t('app.identity-manager.role.roleIdPath', undefined, 'Role ID (path)')">
									<input type="text" class="wt w-100" :value="selectedRole.roleId" disabled>
								</wt-field>
								<div class="form-row">
									<wt-field class="flex-grow-1" :label="t('app.identity-manager.field.displayName', undefined, 'Display Name')">
										<input type="text" class="wt w-100" v-model="roleEditForm.displayName">
									</wt-field>
									<wt-field class="flex-grow-1" :label="t('app.identity-manager.field.depth', undefined, 'Depth')">
										<input type="text" class="wt w-100" :value="selectedRole.depth" disabled>
									</wt-field>
								</div>
								<wt-field :label="t('app.identity-manager.field.description', undefined, 'Description')">
									<textarea class="wt w-100" rows="2" v-model="roleEditForm.description"></textarea>
								</wt-field>
							</div>

							<div class="property-group">
								<div class="property-group-title">{{ t('app.identity-manager.field.ancestors', undefined, 'Ancestors') }}</div>
								<div v-if="selectedRole.ancestors && selectedRole.ancestors.length > 0" class="chip-list">
									<span v-for="a in selectedRole.ancestors" :key="a.roleId" class="chip muted">
										<i class="bi bi-shield"></i>
										<span>{{ a.displayName || a.roleId }}</span>
									</span>
								</div>
								<div v-else class="text-muted">{{ t('app.identity-manager.role.rootLevelNote', undefined, 'This is a root-level role.') }}</div>
							</div>

							<div class="property-group">
								<div class="property-group-title">{{ t('app.identity-manager.section.actions', undefined, 'Actions') }}</div>
								<div class="form-actions">
									<button class="wt wt-primary" @click="saveRole">
										<i class="bi bi-check-lg me-1"></i>{{ t('app.identity-manager.action.save', undefined, 'Save') }}
									</button>
									<button class="wt wt-danger wt-outlined" @click="confirmDeleteRole">
										<i class="bi bi-trash me-1"></i>{{ t('app.identity-manager.action.delete', undefined, 'Delete') }}
									</button>
								</div>
								<div class="timestamp-line" v-if="selectedRole.created">
									{{ t('app.identity-manager.field.created', undefined, 'Created') }}: {{ formatDate(selectedRole.created) }}<span v-if="selectedRole.lastModified"> · {{ t('app.identity-manager.field.modified', undefined, 'Modified') }}: {{ formatDate(selectedRole.lastModified) }}</span>
								</div>
							</div>
						</div>
					</template>
					<wt-empty-state v-else icon="bi-shield">{{ t('app.identity-manager.empty.selectRole', undefined, 'Select a role to view details') }}</wt-empty-state>
				</template>

			</div>
		</div>

		<!-- Bottom Status Bar (translucent) -->
		<div class="status-bar window-drag-region">
			<div class="status-group">
				<span class="status-item">{{ listStatusText }}</span>
			</div>
			<span class="nav-spacer"></span>
		</div>

		<!-- Loading Overlay -->
		<wt-spinner v-if="isLoading" overlay size="lg"></wt-spinner>

		<!-- Error Dialog -->
		<wt-dialog :open="!!errorMessage" size="sm" @close="errorMessage = ''">
			<template v-slot:title="d">
				<i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>{{ t('app.identity-manager.dialog.noticeTitle', undefined, 'Notice') }}
			</template>
			<template v-slot="d">
				<p class="mt-0 mb-0">{{ errorMessage }}</p>
			</template>
			<template v-slot:footer="d">
				<button class="wt wt-primary" @click="errorMessage = ''">{{ t('app.identity-manager.action.ok', undefined, 'OK') }}</button>
			</template>
		</wt-dialog>

		<!-- Create User Dialog -->
		<wt-dialog :open="dialog.type === 'createUser'" @close="closeDialog">
			<template v-slot:title="d">
				<i class="bi bi-person-plus me-2"></i>{{ t('app.identity-manager.action.newUser', undefined, 'New User') }}
			</template>
			<template v-slot="d">
				<div class="form-row">
					<wt-field class="flex-grow-1" :label="t('app.identity-manager.field.username', undefined, 'Username')" required>
						<input type="text" class="wt w-100" v-model="dialog.data.username">
					</wt-field>
					<wt-field class="flex-grow-1" :label="t('app.identity-manager.field.password', undefined, 'Password')" :required="!dialog.data.service">
						<input type="password" class="wt w-100" v-model="dialog.data.password"
							:disabled="dialog.data.service"
							:placeholder="dialog.data.service ? t('app.identity-manager.dialog.passwordNotRequired', undefined, 'Not required for service accounts') : ''">
					</wt-field>
				</div>
				<div class="form-row mt-2">
					<wt-field class="flex-grow-1" :label="t('app.identity-manager.field.displayName', undefined, 'Display Name')">
						<input type="text" class="wt w-100" v-model="dialog.data.displayName">
					</wt-field>
					<wt-field class="flex-grow-1" :label="t('app.identity-manager.field.email', undefined, 'Email')">
						<input type="email" class="wt w-100" v-model="dialog.data.mail" :disabled="dialog.data.service">
					</wt-field>
				</div>
				<wt-field class="mt-2"
					:hint="t('app.identity-manager.dialog.serviceAccountHint', undefined, 'A non-interactive identity used by integrations (via runAs). Has no password and can never sign in.')">
					<wt-checkbox v-model="dialog.data.service"
						:label="t('app.identity-manager.dialog.serviceAccount', undefined, 'Service account')"></wt-checkbox>
				</wt-field>
			</template>
			<template v-slot:footer="d">
				<button class="wt" @click="closeDialog">{{ t('app.identity-manager.action.cancel', undefined, 'Cancel') }}</button>
				<button class="wt wt-primary" @click="createUser"
					:disabled="!dialog.data.username || (!dialog.data.service && !dialog.data.password)">{{ t('app.identity-manager.action.create', undefined, 'Create') }}</button>
			</template>
		</wt-dialog>

		<!-- Create Group Dialog -->
		<wt-dialog :open="dialog.type === 'createGroup'" @close="closeDialog">
			<template v-slot:title="d">
				<i class="bi bi-folder-plus me-2"></i>{{ t('app.identity-manager.action.newGroup', undefined, 'New Group') }}
			</template>
			<template v-slot="d">
				<wt-field :label="t('app.identity-manager.field.name', undefined, 'Name')" required>
					<input type="text" class="wt w-100" v-model="dialog.data.name" :placeholder="t('app.identity-manager.dialog.groupNamePlaceholder', undefined, 'e.g. tokyo')">
				</wt-field>
				<wt-field class="mt-2" :label="t('app.identity-manager.field.parentGroup', undefined, 'Parent Group')">
					<wt-select v-model="dialog.data.parentGroupId" :items="parentGroupItems"></wt-select>
				</wt-field>
				<wt-field class="mt-2" :label="t('app.identity-manager.field.displayName', undefined, 'Display Name')">
					<input type="text" class="wt w-100" v-model="dialog.data.displayName">
				</wt-field>
			</template>
			<template v-slot:footer="d">
				<button class="wt" @click="closeDialog">{{ t('app.identity-manager.action.cancel', undefined, 'Cancel') }}</button>
				<button class="wt wt-primary" @click="createGroup"
					:disabled="!dialog.data.name">{{ t('app.identity-manager.action.create', undefined, 'Create') }}</button>
			</template>
		</wt-dialog>

		<!-- Create Role Dialog -->
		<wt-dialog :open="dialog.type === 'createRole'" @close="closeDialog">
			<template v-slot:title="d">
				<i class="bi bi-shield-plus me-2"></i>{{ t('app.identity-manager.action.newRole', undefined, 'New Role') }}
			</template>
			<template v-slot="d">
				<wt-field :label="t('app.identity-manager.field.name', undefined, 'Name')" required>
					<input type="text" class="wt w-100" v-model="dialog.data.name" :placeholder="t('app.identity-manager.dialog.roleNamePlaceholder', undefined, 'e.g. editor')">
				</wt-field>
				<wt-field class="mt-2" :label="t('app.identity-manager.field.parentRole', undefined, 'Parent Role')">
					<wt-select v-model="dialog.data.parentRoleId" :items="parentRoleItems"></wt-select>
				</wt-field>
				<wt-field class="mt-2" :label="t('app.identity-manager.field.displayName', undefined, 'Display Name')">
					<input type="text" class="wt w-100" v-model="dialog.data.displayName">
				</wt-field>
				<wt-field class="mt-2" :label="t('app.identity-manager.field.description', undefined, 'Description')">
					<textarea class="wt w-100" rows="2" v-model="dialog.data.description"></textarea>
				</wt-field>
			</template>
			<template v-slot:footer="d">
				<button class="wt" @click="closeDialog">{{ t('app.identity-manager.action.cancel', undefined, 'Cancel') }}</button>
				<button class="wt wt-primary" @click="createRole"
					:disabled="!dialog.data.name">{{ t('app.identity-manager.action.create', undefined, 'Create') }}</button>
			</template>
		</wt-dialog>

		<!-- Confirm Delete Dialog -->
		<wt-dialog :open="dialog.type === 'confirmDelete'" size="sm" @close="closeDialog">
			<template v-slot:title="d">
				<i class="bi bi-exclamation-triangle-fill me-2"></i>{{ t('app.identity-manager.dialog.confirmDeleteTitle', undefined, 'Confirm Delete') }}
			</template>
			<template v-slot="d">
				<p class="mt-0 mb-0">{{ dialog.data.message }}</p>
			</template>
			<template v-slot:footer="d">
				<button class="wt" @click="closeDialog">{{ t('app.identity-manager.action.cancel', undefined, 'Cancel') }}</button>
				<button class="wt wt-danger" @click="executeDelete">
					<i class="bi bi-trash me-1"></i>{{ t('app.identity-manager.action.delete', undefined, 'Delete') }}
				</button>
			</template>
		</wt-dialog>

		</template>
		<!-- /Readiness gate -->
	</div>

	<script type="module" src="./app.js?v=__BUILD_VERSION__"></script>
</body>

</html>
