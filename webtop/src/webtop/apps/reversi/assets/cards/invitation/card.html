<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reversi</title>
<style>
	/* M PLUS Rounded 1c, vendored with the Webtop (rollup.config.js). The
	 * card is served from the app's folder, so the Webtop's vendor folder
	 * is five levels up; if it cannot be reached the stack below falls
	 * back to the system's rounded fonts. */
	@import url("../../../../../vendor/m-plus-rounded-1c/500.css");
	@import url("../../../../../vendor/m-plus-rounded-1c/700.css");
	@import url("../../../../../vendor/m-plus-rounded-1c/800.css");

	/* The page of the Reversi invitation card (see card.yml). A little
	 * strawberry-mint board with the chick and the strawberry stands for the
	 * game, in the picture-book tone of the app; the text says who invites
	 * whom and which side the invited user plays; the buttons answer: the
	 * first opens the game, the second declines the invitation (the host
	 * takes it back) while it waits for an answer. The room's state is read
	 * with the reader's credentials, so a card that was answered says so;
	 * while the room is open it is read again now and then, and when the
	 * reader comes back to the page, as a card has no stream of its own. */
	:root {
		color-scheme: light;
		--bg: linear-gradient(180deg, #ffffff 0%, #fff8f3 100%);
		--edge: #ffffff;
		--text: #4d2c31;
		--text-soft: #927076;
		--primary: #ed5a77;
		--primary-deep: #d83a5d;
		--primary-soft: #ffe3ec;
		--chip-bg: #ffe3ec;
		--chip-text: #d83a5d;
		--button-bg: #ffffff;
		--scene: linear-gradient(160deg, #ffe3ec 0%, #ffcdda 100%);
		--hill: #ffd9c6;
		--frame: #dff3e8;
		--frame-edge: #c4e6d4;
		--cell: #eaf8f0;
		--shadow: rgba(150, 70, 85, 0.16);
		--shadow-soft: rgba(150, 70, 85, 0.1);
	}
	:root[data-theme="dark"] {
		color-scheme: dark;
		--bg: linear-gradient(180deg, #332026 0%, #2c191e 100%);
		--edge: rgba(255, 255, 255, 0.1);
		--text: #ffe9ef;
		--text-soft: #c79aa6;
		--primary: #ed5a77;
		--primary-deep: #ff7b94;
		--primary-soft: rgba(237, 90, 119, 0.35);
		--chip-bg: rgba(237, 90, 119, 0.2);
		--chip-text: #ffb3c4;
		--button-bg: rgba(255, 255, 255, 0.06);
		--scene: linear-gradient(160deg, #5a2f3f 0%, #46232f 100%);
		--hill: #6b3a4a;
		--shadow: rgba(0, 0, 0, 0.35);
		--shadow-soft: rgba(0, 0, 0, 0.25);
	}

	html, body { margin: 0; padding: 0; background: transparent; }
	/* Room under the card for its shadow; the frame takes the page's height. */
	body { padding-bottom: 6px; }
	body {
		font: 13px/1.6 "M PLUS Rounded 1c", "Rounded Mplus 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Meiryo UI", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
		color: var(--text);
		-webkit-font-smoothing: antialiased;
	}
	.card {
		display: flex;
		border: 1.5px solid var(--edge);
		border-radius: 18px;
		background: var(--bg);
		box-shadow: 0 12px 28px -16px var(--shadow);
		overflow: hidden;
	}

	/* The scene: a sky of strawberry milk over a hill, the board floating in front. */
	.scene {
		position: relative;
		flex-shrink: 0;
		display: grid;
		place-items: center;
		width: 8.5rem;
		min-height: 8.5rem;
		background: var(--scene);
		overflow: hidden;
	}
	.scene .hill {
		position: absolute;
		left: -20%;
		right: -20%;
		bottom: -1.75rem;
		height: 3.5rem;
		border-radius: 50%;
		background: var(--hill);
	}
	.scene .spark {
		position: absolute;
		width: 0.55rem;
		height: 0.55rem;
		color: #ffffff;
		opacity: 0.85;
		animation: twinkle 2.6s ease-in-out infinite;
	}
	.scene .spark.s1 { top: 0.8rem; left: 1rem; }
	.scene .spark.s2 { top: 1.6rem; right: 1rem; width: 0.4rem; height: 0.4rem; animation-delay: -0.9s; }
	.scene .spark.s3 { bottom: 1.4rem; left: 1.4rem; width: 0.35rem; height: 0.35rem; animation-delay: -1.7s; }
	@keyframes twinkle {
		0%, 100% { transform: scale(0.75); opacity: 0.45; }
		50% { transform: scale(1.1); opacity: 0.95; }
	}
	.board {
		position: relative;
		display: grid;
		grid-template-columns: repeat(2, 1fr);
		grid-template-rows: repeat(2, 1fr);
		gap: 4px;
		width: 4.6rem;
		padding: 6px;
		border-radius: 14px;
		background: var(--frame);
		box-shadow:
			inset 0 0 0 2px var(--frame-edge),
			0 10px 18px -6px var(--shadow);
		transform: rotate(-6deg);
	}
	.board i {
		display: grid;
		place-items: center;
		aspect-ratio: 1;
		border-radius: 28%;
		background: var(--cell);
	}
	.board svg {
		display: block;
		width: 80%;
		height: 80%;
		border-radius: 50%;
		box-shadow: 0 2px 0 var(--rim), 0 4px 6px rgba(77, 44, 49, 0.22);
	}
	.board .chick { --rim: #d9a530; }
	.board .berry { --rim: #b8304f; }

	.body { flex: 1; min-width: 0; padding: 0.875rem 1.125rem 1rem; }
	.game {
		display: inline-block;
		margin-bottom: 0.375rem;
		padding: 0.1rem 0.7rem;
		border-radius: 999px;
		background: var(--chip-bg);
		color: var(--chip-text);
		font-size: 11px;
		font-weight: 700;
		letter-spacing: 0.04em;
	}
	.game:empty { display: none; }
	.game::before { content: '🍓 '; }
	.title { font-size: 15px; font-weight: 800; line-height: 1.45; overflow-wrap: anywhere; }
	.meta { margin-top: 0.3rem; color: var(--text-soft); display: flex; flex-direction: column; gap: 0.125rem; }
	.meta div:empty { display: none; }
	/* The side, with the disc it plays beside it. */
	.side { display: flex; align-items: center; gap: 0.4rem; }
	.side::before {
		content: '';
		flex-shrink: 0;
		width: 0.85rem;
		height: 0.85rem;
		border-radius: 50%;
		background: radial-gradient(circle at 35% 30%, #8a6168, #4d2c31 62%);
		box-shadow: 0 1.5px 0 #3a2025;
	}
	.side.is-white::before {
		background: radial-gradient(circle at 35% 30%, #ffffff, #fff1e8 62%);
		box-shadow: 0 1.5px 0 #f0d9cf;
	}
	.status { margin-top: 0.45rem; font-weight: 700; color: var(--primary-deep); }
	.status:empty { display: none; }
	.status.is-over { color: var(--text-soft); }
	/* Waiting for an answer: three dots breathing after the text. */
	.status.is-waiting::after {
		content: '';
		display: inline-block;
		width: 1.2em;
		text-align: left;
		animation: dots 1.4s steps(4, end) infinite;
	}
	@keyframes dots {
		0% { content: ''; }
		25% { content: '.'; }
		50% { content: '..'; }
		75% { content: '...'; }
	}
	.actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
	.actions[hidden] { display: none; }
	.open, .decline {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		padding: 0.4rem 1.1rem;
		border: 0;
		border-radius: 999px;
		font: inherit;
		font-weight: 700;
		line-height: 1.4;
		cursor: pointer;
		transition: transform 0.2s cubic-bezier(.34, 1.4, .64, 1), box-shadow 0.2s, background-color 0.2s, border-color 0.2s;
	}
	.open {
		background: var(--primary);
		color: #fff;
		box-shadow: 0 8px 18px -8px var(--primary);
	}
	.open:hover { background: var(--primary-deep); transform: translateY(-2px); box-shadow: 0 12px 22px -8px var(--primary); }
	.open:active { transform: translateY(0); }
	.decline {
		border: 1.5px solid var(--primary-soft);
		background: var(--button-bg);
		color: var(--text-soft);
		box-shadow: 0 6px 14px -10px var(--shadow);
	}
	.decline:hover { border-color: var(--primary); color: var(--primary-deep); transform: translateY(-2px); }
	.open[hidden], .decline[hidden] { display: none; }
	.open:disabled, .decline:disabled { opacity: 0.6; cursor: default; transform: none; }
	.open:focus-visible, .decline:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

	/* A narrow thread: the scene becomes a band over the text. */
	@media (max-width: 23rem) {
		.card { flex-direction: column; }
		.scene { width: auto; min-height: 6.5rem; }
		.board { width: 4.2rem; }
	}
	@media (prefers-reduced-motion: reduce) {
		.scene .spark, .status.is-waiting::after { animation: none; }
		.status.is-waiting::after { content: '…'; }
		.open, .decline { transition: none; }
	}
</style>
</head>
<body>
<div class="card">
	<div class="scene" aria-hidden="true">
		<span class="hill"></span>
		<svg class="spark s1" viewBox="0 0 10 10"><path d="M5 0 C5.4 3.2 6.8 4.6 10 5 C6.8 5.4 5.4 6.8 5 10 C4.6 6.8 3.2 5.4 0 5 C3.2 4.6 4.6 3.2 5 0 Z" fill="currentColor"/></svg>
		<svg class="spark s2" viewBox="0 0 10 10"><path d="M5 0 C5.4 3.2 6.8 4.6 10 5 C6.8 5.4 5.4 6.8 5 10 C4.6 6.8 3.2 5.4 0 5 C3.2 4.6 4.6 3.2 5 0 Z" fill="currentColor"/></svg>
		<svg class="spark s3" viewBox="0 0 10 10"><path d="M5 0 C5.4 3.2 6.8 4.6 10 5 C6.8 5.4 5.4 6.8 5 10 C4.6 6.8 3.2 5.4 0 5 C3.2 4.6 4.6 3.2 5 0 Z" fill="currentColor"/></svg>
		<svg width="0" height="0" style="position:absolute">
			<defs>
				<radialGradient id="fluff" cx="0.36" cy="0.3" r="0.8">
					<stop offset="0" stop-color="#fff3b8"/>
					<stop offset="0.6" stop-color="#ffd659"/>
					<stop offset="1" stop-color="#f2b93b"/>
				</radialGradient>
				<radialGradient id="berry" cx="0.36" cy="0.32" r="0.8">
					<stop offset="0" stop-color="#ff9db2"/>
					<stop offset="0.55" stop-color="#ed5a77"/>
					<stop offset="1" stop-color="#cf3658"/>
				</radialGradient>
				<!-- The chick (assets/discs/chick.svg). -->
				<g id="chick-face">
					<circle cx="50" cy="50" r="50" fill="url(#fluff)"/>
					<path d="M46 14 C44 8 48 4 52 6 C50 9 51 12 54 14" fill="none" stroke="#f2b93b" stroke-width="4" stroke-linecap="round"/>
					<circle cx="36" cy="46" r="5.5" fill="#4d2c31"/>
					<circle cx="64" cy="46" r="5.5" fill="#4d2c31"/>
					<circle cx="37.8" cy="44" r="1.8" fill="#ffffff"/>
					<circle cx="65.8" cy="44" r="1.8" fill="#ffffff"/>
					<ellipse cx="27" cy="59" rx="7" ry="4.5" fill="#ff9ebb" fill-opacity="0.7"/>
					<ellipse cx="73" cy="59" rx="7" ry="4.5" fill="#ff9ebb" fill-opacity="0.7"/>
					<path d="M42 56 L58 56 L50 66 Z" fill="#f7a072" stroke="#e58a5a" stroke-width="2" stroke-linejoin="round"/>
					<ellipse cx="34" cy="24" rx="10" ry="5" fill="#ffffff" fill-opacity="0.3" transform="rotate(-25 34 24)"/>
				</g>
				<!-- The strawberry (assets/discs/strawberry.svg). -->
				<g id="berry-face">
					<circle cx="50" cy="50" r="50" fill="url(#berry)"/>
					<g fill="#ffe7a3">
						<ellipse cx="30" cy="48" rx="2.6" ry="3.6" transform="rotate(-20 30 48)"/>
						<ellipse cx="46" cy="44" rx="2.6" ry="3.6"/>
						<ellipse cx="62" cy="47" rx="2.6" ry="3.6" transform="rotate(20 62 47)"/>
						<ellipse cx="74" cy="58" rx="2.6" ry="3.6" transform="rotate(25 74 58)"/>
						<ellipse cx="38" cy="62" rx="2.6" ry="3.6" transform="rotate(-10 38 62)"/>
						<ellipse cx="54" cy="60" rx="2.6" ry="3.6" transform="rotate(10 54 60)"/>
						<ellipse cx="26" cy="64" rx="2.6" ry="3.6" transform="rotate(-25 26 64)"/>
						<ellipse cx="46" cy="76" rx="2.6" ry="3.6"/>
						<ellipse cx="64" cy="73" rx="2.6" ry="3.6" transform="rotate(15 64 73)"/>
					</g>
					<path d="M50 30 C44 22 34 20 26 24 C34 26 38 30 40 33 C34 34 28 38 26 44 C34 40 42 38 50 37 C58 38 66 40 74 44 C72 38 66 34 60 33 C62 30 66 26 74 24 C66 20 56 22 50 30 Z" fill="#57b894"/>
					<path d="M50 30 C50 24 52 18 56 14" fill="none" stroke="#3f9677" stroke-width="4" stroke-linecap="round"/>
					<ellipse cx="34" cy="26" rx="10" ry="5" fill="#ffffff" fill-opacity="0.18" transform="rotate(-25 34 26)"/>
				</g>
			</defs>
		</svg>
		<div class="board">
			<i><svg class="chick" viewBox="0 0 100 100"><use href="#chick-face"/></svg></i>
			<i><svg class="berry" viewBox="0 0 100 100"><use href="#berry-face"/></svg></i>
			<i><svg class="berry" viewBox="0 0 100 100"><use href="#berry-face"/></svg></i>
			<i><svg class="chick" viewBox="0 0 100 100"><use href="#chick-face"/></svg></i>
		</div>
	</div>
	<div class="body">
		<span class="game" id="game"></span>
		<div class="title" id="title"></div>
		<div class="meta">
			<div class="side" id="side"></div>
			<div id="board"></div>
		</div>
		<div class="status" id="status"></div>
		<div class="actions" id="actions" hidden>
			<button type="button" class="open" id="open" hidden></button>
			<button type="button" class="decline" id="decline" hidden></button>
		</div>
	</div>
</div>
<script>
(() => {
	let host = null;
	try {
		host = window.parent && window.parent.ChatCardHost ? window.parent.ChatCardHost.connect(window) : null;
	} catch (e) {
		host = null;
	}
	if (!host) {
		document.body.textContent = 'This page is shown as a card of a conversation.';
		return;
	}

	const APP = 'reversi';
	const OPEN = ['waiting', 'lobby', 'playing'];
	// How often an open room is read again, and how soon after the button.
	const POLL_MS = 20000;
	const AFTER_OPEN_MS = 2000;
	const byId = (id) => document.getElementById(id);
	// The design's messages, i18n/<locale>.json in this folder.
	const t = (key, params) => host.translate(key, params);
	// The room as it is now: null until read, 'gone' when it cannot be.
	let room = null;
	let pollTimer = null;

	function applyTheme(theme) {
		document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
	}

	function render() {
		const f = host.card.fields || {};
		const me = (host.currentUser && host.currentUser.id) || '';
		const isHost = !!f.host && f.host === me;
		const guestName = f.guestName || f.guest || '';
		const hostName = f.hostName || f.host || '';
		const guestFirst = f.side !== 'white';
		document.documentElement.lang = (host.localization && host.localization.locale) || 'en';

		byId('game').textContent = t('page.title');
		byId('title').textContent = isHost ? t('page.youInvited', { guestName }) : t('page.invitesYou', { hostName });
		const side = byId('side');
		side.textContent = isHost ?
			t(guestFirst ? 'page.theyFirst' : 'page.theySecond', { guestName }) :
			t(guestFirst ? 'page.youFirst' : 'page.youSecond');
		// The disc beside the side is the reader's: the invited user's, or the other one.
		side.classList.toggle('is-white', isHost ? guestFirst : !guestFirst);
		const size = Number(f.size);
		byId('board').textContent = (size && size !== 8) ? t('page.board', { size }) : '';

		const status = byId('status');
		const actions = byId('actions');
		const open = byId('open');
		const decline = byId('decline');
		actions.hidden = true;
		open.hidden = true;
		decline.hidden = true;
		status.classList.remove('is-waiting', 'is-over');
		if (room === null) {
			status.textContent = '';
		} else if (room === 'gone' || !OPEN.includes(room.status)) {
			// Told from the reader's side: who declined, left or took back.
			let text;
			if (room === 'gone') text = t('page.status.gone');
			else if (room.status === 'finished') text = t('page.status.finished');
			else if (room.status === 'declined') text = isHost ? t('page.status.notJoined.them', { guestName }) : t('page.status.notJoined.you');
			else if (room.status === 'left') text = isHost ? t('page.status.left.them', { guestName }) : t('page.status.left.you');
			else if (room.status === 'cancelled') text = isHost ? t('page.status.cancelled.you') : t('page.status.cancelled.them', { hostName });
			else text = t('page.status.gone');
			status.textContent = text;
			status.classList.add('is-over');
		} else {
			// The invited user, asked: the title says it all, the buttons answer.
			const waiting = room.status === 'waiting';
			const joining = waiting && !isHost;
			status.textContent = joining ? '' : t('page.status.' + room.status);
			status.classList.toggle('is-waiting', waiting && isHost);
			open.textContent = joining ? t('page.join') : t('page.open');
			open.hidden = false;
			// While the invitation waits for an answer, either player may end
			// it here: the invited user declines, the host takes it back.
			decline.textContent = isHost ? t('page.takeBack') : t('page.decline');
			decline.hidden = !waiting;
			actions.hidden = false;
		}
		host.resize();
	}

	/** Reads the room again later, while it is open. */
	function schedule(ms) {
		if (pollTimer) clearTimeout(pollTimer);
		pollTimer = null;
		if (room === 'gone' || (room && !OPEN.includes(room.status))) return;
		pollTimer = setTimeout(() => { pollTimer = null; load(); }, ms);
	}

	/** Reads the room with the reader's credentials; only its players can. */
	async function load() {
		const id = host.card.fields && host.card.fields.roomId;
		if (!id || host.preview) {
			room = 'gone';
			render();
			return;
		}
		try {
			const data = await host.graphql.query('query ($id: ID!) { reversiRoom(id: $id) { id status host } }', { id });
			room = (data && data.reversiRoom) || 'gone';
		} catch (e) {
			room = 'gone';
		}
		render();
		schedule(POLL_MS);
	}

	byId('open').addEventListener('click', () => {
		const id = host.card.fields && host.card.fields.roomId;
		if (!id) return;
		host.openApp(APP, { roomId: id });
		// The invited user accepts on the way in: the card follows shortly.
		schedule(AFTER_OPEN_MS);
	});
	byId('decline').addEventListener('click', async () => {
		const id = host.card.fields && host.card.fields.roomId;
		if (!id || host.preview) return;
		const button = byId('decline');
		button.disabled = true;
		try {
			const data = await host.graphql.mutation('mutation ($id: ID!) { reversiDecline(id: $id) { id status host } }', { id });
			room = (data && data.reversiDecline) || 'gone';
			render();
			schedule(POLL_MS);
		} catch (e) {
			// Answered meanwhile, or not reachable: the room as it is now tells.
			load();
		} finally {
			button.disabled = false;
		}
	});
	// Back at the page after a while: what happened meanwhile.
	document.addEventListener('visibilitychange', () => {
		if (document.visibilityState === 'visible' && room !== null) load();
	});

	applyTheme(host.theme);
	render();
	load();
	host.subscribe((type, payload) => {
		if (type === 'theme') applyTheme(payload);
		else if (type === 'card' || type === 'localization') render();
	});
})();
</script>
</body>
</html>
