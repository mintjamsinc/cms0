identifier: 0e210028-e53e-49c5-a500-6d91ddb0ea06
title: Ambience
icon: assets/icons/icon.svg
# Ambient sound mixer: rain, thunder, waves, a stream, wind, a campfire,
# crickets, birds and white / pink / brown noise, each with its own level.
# Every sound is synthesized in the browser with Web Audio (lib/ambient), so
# there are no recordings to license or download. The sliders, the volume and
# the user's saved mixes are kept per user under
# /home/users/<user>/ambience/ in the system workspace, where the Pomodoro
# timer finds the saved mixes too.
actions:
  open:
    icon: open
    label: Open
minimumWidth: 760
minimumHeight: 520
customWindowControls: true
# One mixer per desktop: a second launch focuses the running one instead of
# starting a second sound.
singleton: true
