<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ambience">
  <defs>
    <clipPath id="clip-ambience"><rect x="0" y="0" width="180" height="180" rx="42" ry="42"/></clipPath>
    <linearGradient id="hl-ambience" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <defs><linearGradient id="bg-ambience" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#14b8a6"/>
    <stop offset="100%" stop-color="#1e3a8a"/>
  </linearGradient></defs>
  <rect x="0" y="0" width="180" height="180" rx="42" ry="42" fill="url(#bg-ambience)"/>
  <g clip-path="url(#clip-ambience)">
    <!-- Cloud with rain -->
    <path d="M 58 92 a 20 20 0 0 1 4 -39 a 28 28 0 0 1 53 6 a 17 17 0 0 1 7 33 Z" fill="white" fill-opacity="0.92"/>
    <g stroke="#a5f3fc" stroke-width="6" stroke-linecap="round">
      <line x1="66" y1="104" x2="60" y2="118"/>
      <line x1="88" y1="104" x2="82" y2="118"/>
      <line x1="110" y1="104" x2="104" y2="118"/>
    </g>
    <!-- Waves -->
    <g fill="none" stroke="white" stroke-width="6" stroke-linecap="round">
      <path d="M 34 140 q 14 -10 28 0 t 28 0 t 28 0 t 28 0" stroke-opacity="0.85"/>
      <path d="M 34 156 q 14 -10 28 0 t 28 0 t 28 0 t 28 0" stroke-opacity="0.45"/>
    </g>
  </g>
  <g clip-path="url(#clip-ambience)">
    <rect x="0" y="0" width="180" height="180" fill="url(#hl-ambience)"/>
    <rect x="0.5" y="0.5" width="179" height="179" rx="41.5" ry="41.5"
          fill="none" stroke="white" stroke-opacity="0.18" stroke-width="1"/>
  </g>
</svg>
