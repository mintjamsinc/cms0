# Example compose file for the MintJams CMS container.
#
# Build:
#   1. Build the Felix distribution (bundles + config) into ./felix-dist
#      relative to the project root.
#   2. From the project root, run:
#        docker compose -f docker/docker-compose.yml build
#        docker compose -f docker/docker-compose.yml up -d
#
# Volumes:
#   cms-repository  - all JCR data, etc/*.yml, sp-keystore.p12, idp-keystore.p12
#   cms-secrets     - the encryption master key (separate volume so it can be
#                     backed up independently)
#   cms-local       - this node's own data (search indexes, temporary files);
#                     rebuildable, and node-local even when the other two are
#                     shared by a cluster

services:
  cms:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mintjams/cms:dev
    container_name: cms
    restart: unless-stopped
    environment:
      # External URL — drives SP rootURL, IdP baseUrl, and all derived URLs.
      CMS_PUBLIC_BASE_URL: "http://localhost:8080"
      # Path to the encryption master key. Keep on a dedicated volume.
      MINTJAMS_CMS_SECRET_KEY_PATH: "/data/secrets/secret-key.yml"
      # Optional: set the initial admin password explicitly instead of having
      # one generated. When unset, a random password is generated on first boot
      # and written to /data/repository/INITIAL_PASSWORD.txt (mode 0600).
      # CMS_INITIAL_ADMIN_PASSWORD: "change-me-on-first-login"
      # Optional: pin the SP / IdP keystore passwords. When unset, random
      # passwords are generated on first boot and written to
      # /data/repository/{SP,IDP}_KEYSTORE_PASSWORD.txt (mode 0600). Stored
      # AES-encrypted in etc/saml2.yml / etc/idp.yml either way.
      # CMS_SP_KEYSTORE_PASSWORD: ""
      # CMS_IDP_KEYSTORE_PASSWORD: ""
      # Optional: extra JVM flags, appended to the ones the image sets.
      # Do NOT set JAVA_TOOL_OPTIONS here - that replaces the repository path
      # and the GC settings the entrypoint assembles, and breaks the container.
      # CMS_JAVA_OPTS: "-Xmx4g"
      #
      # Clustered deployment (CMS_CLUSTER_ENABLED=true) additionally needs the
      # shared database, which the placed jcr.yml / bpm.yml name as variables.
      # cms-repository and cms-secrets are then shared storage mounted by every
      # node, while cms-local stays node-local:
      # CMS_CLUSTER_ENABLED: "true"
      # CMS_CLUSTER_NODE_ID: node-1
      # The nodes also connect to each other directly on the cluster port
      # (default 9080) — over the container network, never through ports:.
      # With more than one network, name the address the others use:
      # CMS_CLUSTER_ADVERTISE_ADDRESS: node-1:9080
      # CMS_DB_HOST: db
      # CMS_DB_USER: jcr
      # CMS_DB_PASSWORD_FILE: /run/secrets/cms_db_password
      #
      # The password can instead be written into jcr.yml / bpm.yml as
      # ENC[v1:...]; see docker/README.md, "Encrypting a value".
    ports:
      - "8080:8080"
    volumes:
      - cms-repository:/data/repository
      - cms-secrets:/data/secrets
      - cms-local:/data/local

volumes:
  cms-repository:
  cms-secrets:
  cms-local:
