defaultNodes:
  - path: /
    primaryType: mi:root
    acl:
      - group: everyone
        privileges: jcr:read, jcr:readAccessControl, jcr:lockManagement, jcr:versionManagement, jcr:nodeTypeManagement
        effect: allow
      - user: anonymous
        privileges: jcr:all
        effect: deny

# This file is read by every node of the cluster — with the repository
# directory on shared storage there is only one copy of it. Values that differ
# per deployment or per node are therefore named here and supplied from
# outside: ${env.NAME} reads the environment variable NAME, and
# ${env.NAME:-default} falls back to a default when it is unset.
# See documents/clustering.md.

# Workspace database. Every node must point at the same database, and each
# workspace needs its own (the operator creates it; the platform only creates
# the tables). The PostgreSQL driver bundle has to be installed for
# driverClassName to load.
#
# The password has three interchangeable forms — use whichever the deployment
# is set up for:
#   password: ${env.CMS_DB_PASSWORD}      the environment variable itself
#   CMS_DB_PASSWORD_FILE=/run/secrets/…   a Docker secret or a mounted
#                                         Kubernetes Secret, which keeps the
#                                         value out of `docker inspect`
#   password: ENC[v1:…]                   encrypted with this installation's
#                                         secret key, written straight into
#                                         this file:
#                                           docker exec -i cms cms-encrypt
datasource:
    jdbcURL: jdbc:postgresql://${env.CMS_DB_HOST}:${env.CMS_DB_PORT:-5432}/jcr_${workspace.name}
    username: ${env.CMS_DB_USER}
    password: ${env.CMS_DB_PASSWORD}
    driverClassName: org.postgresql.Driver

# Binary (blob) storage. Without a directory, blobs are stored as files under
# <workspace>/var/jcr/bin — already shared storage in the recommended layout,
# where the repository directory itself is shared. Set `directory` only to put
# blobs on storage of their own; it must be shared by all nodes either way.
blobstore:
    type: fs

search:
    suggestion:
        propertyKeys: mi:suggestions
    # The full-text search index is node-local: every node maintains its own,
    # and a node that starts with an empty index directory builds it from the
    # repository content. CMS_SEARCH_INDEX_PATH is the image's node-local
    # volume (/data/index), which keeps Lucene off the shared storage; the
    # node identifier below is the same guard the platform's own default uses,
    # in case that volume is shared after all.
    indexPath: ${env.CMS_SEARCH_INDEX_PATH}/${workspace.name}/nodes/${cluster.nodeId}

security:
    filters: [
        { path: /content/public/*, user: anonymous, type: publicAccess },
        { path: /content/WEB-INF/*, user: anonymous, type: publicAccess }
        ]
