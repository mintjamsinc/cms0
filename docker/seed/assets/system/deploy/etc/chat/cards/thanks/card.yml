# A thank-you card: a word of thanks that stands out in the conversation. The
# texts are keys of i18n/<locale>.json in this folder.
label: card.label
description: card.description
summary: card.summary
fields:
  - key: to
    label: field.to.label
    type: STRING
    required: true
    description: field.to.description
  - key: message
    label: field.message.label
    type: STRING
    required: true
