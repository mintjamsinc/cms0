# An invitation to a meeting: when, where, what for. The texts are keys of
# i18n/<locale>.json in this folder.
label: card.label
description: card.description
summary: card.summary
fields:
  - key: title
    label: field.title.label
    type: STRING
    required: true
  - key: date
    label: field.date.label
    type: DATE
    required: true
  - key: end
    label: field.end.label
    type: DATE
  - key: kind
    label: field.kind.label
    type: STRING
    choices:
      - { value: onsite, label: field.kind.choice.onsite, color: blueberry }
      - { value: online, label: field.kind.choice.online, color: peacock }
      - { value: hybrid, label: field.kind.choice.hybrid, color: grape }
  - key: place
    label: field.place.label
    type: STRING
    description: field.place.description
  - key: url
    label: field.url.label
    type: STRING
    description: field.url.description
  - key: agenda
    label: field.agenda.label
    type: STRING
    multiple: true
    description: field.agenda.description
