# A notice: something to know, told once, at a glance.
#
# A card design is a folder under /etc/chat/cards with this descriptor and
# card.html, the page that shows the card. The fields are declared the way the
# columns of a dataset are (see documents/webtop-chat.md, "Cards").
#
# The texts are keys of the design's messages, i18n/<locale>.json in this
# folder; a text that is no key is shown as it is written.
label: card.label
description: card.description
# The message's text when none is written: the fields by {{key}}.
summary: card.summary
fields:
  - key: title
    label: field.title.label
    type: STRING
    required: true
  - key: message
    label: field.message.label
    type: STRING
    description: field.message.description
  - key: level
    label: field.level.label
    type: STRING
    choices:
      - { value: info, label: field.level.choice.info, color: peacock }
      - { value: success, label: field.level.choice.success, color: basil }
      - { value: warning, label: field.level.choice.warning, color: banana }
      - { value: danger, label: field.level.choice.danger, color: tomato }
