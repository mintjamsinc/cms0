<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting</title>
<style>
	/* The page of the Meeting card (see notice/card.html for how a card page works). */
	:root {
		color-scheme: light;
		--bg: #ffffff;
		--text: #1f2430;
		--text-soft: #5b6472;
		--edge: rgba(31, 36, 48, 0.1);
		--accent: #3f51b5;
		--accent-2: #7986cb;
		--chip: rgba(63, 81, 181, 0.1);
	}
	:root[data-theme="dark"] {
		color-scheme: dark;
		--bg: #1e2128;
		--text: #e8eaee;
		--text-soft: #a3aab5;
		--edge: rgba(255, 255, 255, 0.1);
		--accent: #7986cb;
		--accent-2: #9fa8da;
		--chip: rgba(121, 134, 203, 0.18);
	}
	:root[data-kind="online"] { --accent: #039be5; --accent-2: #4fc3f7; --chip: rgba(3, 155, 229, 0.12); }
	:root[data-kind="hybrid"] { --accent: #8e24aa; --accent-2: #ba68c8; --chip: rgba(142, 36, 170, 0.12); }

	html, body { margin: 0; padding: 0; background: transparent; }
	body {
		font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans JP", sans-serif;
		color: var(--text);
	}
	.card {
		display: flex;
		border: 1px solid var(--edge);
		border-radius: 10px;
		background: var(--bg);
		overflow: hidden;
	}
	.when {
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		flex-shrink: 0;
		width: 5.25rem;
		padding: 0.875rem 0.5rem;
		background: linear-gradient(160deg, var(--accent), var(--accent-2));
		color: #fff;
		text-align: center;
	}
	.when .month { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.9; }
	.when .day { font-size: 2rem; font-weight: 700; line-height: 1.05; }
	.when .weekday { font-size: 11px; opacity: 0.9; }
	.when .time { margin-top: 0.375rem; padding: 0.0625rem 0.5rem; border-radius: 999px; background: rgba(255, 255, 255, 0.22); font-size: 12px; font-weight: 600; }
	.body { flex: 1; min-width: 0; padding: 0.75rem 1rem 0.875rem; }
	.kind {
		display: inline-block;
		margin-bottom: 0.25rem;
		padding: 0 0.5rem;
		border-radius: 999px;
		background: var(--chip);
		color: var(--accent);
		font-size: 11px;
		font-weight: 600;
		text-transform: uppercase;
		letter-spacing: 0.06em;
	}
	.kind:empty { display: none; }
	.title { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
	.title.empty { color: var(--text-soft); font-style: italic; }
	.meta { margin-top: 0.25rem; color: var(--text-soft); display: flex; flex-direction: column; gap: 0.125rem; }
	.meta div:empty { display: none; }
	.agenda { margin: 0.5rem 0 0; padding-left: 1.125rem; }
	.agenda:empty { display: none; }
	.agenda li { overflow-wrap: anywhere; }
	.join {
		display: inline-block;
		margin-top: 0.625rem;
		padding: 0.3rem 0.875rem;
		border-radius: 6px;
		background: var(--accent);
		color: #fff;
		font-weight: 600;
		text-decoration: none;
	}
	.join:hover { filter: brightness(1.08); }
	.join[hidden] { display: none; }
</style>
</head>
<body>
<div class="card">
	<div class="when">
		<span class="month" id="month"></span>
		<span class="day" id="day"></span>
		<span class="weekday" id="weekday"></span>
		<span class="time" id="time"></span>
	</div>
	<div class="body">
		<span class="kind" id="kind"></span>
		<div class="title" id="title"></div>
		<div class="meta">
			<div id="range"></div>
			<div id="place"></div>
		</div>
		<ul class="agenda" id="agenda"></ul>
		<a class="join" id="join" target="_blank" rel="noopener noreferrer" hidden></a>
	</div>
</div>
<script>
(() => {
	let host = null;
	try {
		host = window.parent && window.parent.ChatCardHost ? window.parent.ChatCardHost.connect(window) : null;
	} catch (e) {
		host = null;
	}
	if (!host) {
		document.body.textContent = 'This page is shown as a card of a conversation.';
		return;
	}

	const KINDS = ['onsite', 'online', 'hybrid'];
	const byId = (id) => document.getElementById(id);
	// The design's messages, i18n/<locale>.json in its folder.
	const t = (key, params) => host.translate(key, params);

	function applyTheme(theme) {
		document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
	}

	function part(formatter, date, type) {
		const p = formatter.formatToParts(date).find((x) => x.type === type);
		return p ? p.value : '';
	}

	// CJK locales run the weekday into the date ("2026年10月5日月曜日"); give it a space.
	function joinParts(parts) {
		let out = '';
		for (const p of parts) {
			if (p.type === 'weekday' && out && !/[\s,(（、]$/.test(out)) out += ' ';
			out += p.value;
		}
		return out;
	}

	function render(fields) {
		const f = fields || {};
		const loc = host.localization || {};
		const locale = loc.locale || undefined;
		const timeZone = loc.timeZone || undefined;
		document.documentElement.lang = locale || 'en';
		document.documentElement.dataset.kind = KINDS.includes(f.kind) ? f.kind : 'onsite';

		const start = f.date ? new Date(f.date) : null;
		const end = f.end ? new Date(f.end) : null;
		const valid = (d) => d && !isNaN(d.getTime());
		if (valid(start)) {
			const dayParts = new Intl.DateTimeFormat(locale, { month: 'short', day: 'numeric', weekday: 'short', timeZone });
			byId('month').textContent = part(dayParts, start, 'month');
			byId('day').textContent = part(dayParts, start, 'day');
			byId('weekday').textContent = part(dayParts, start, 'weekday');
			byId('time').textContent = new Intl.DateTimeFormat(locale, { hour: '2-digit', minute: '2-digit', timeZone }).format(start);
			const full = new Intl.DateTimeFormat(locale, { dateStyle: 'full', timeStyle: 'short', timeZone });
			byId('range').textContent = joinParts(valid(end) ? full.formatRangeToParts(start, end) : full.formatToParts(start));
		} else {
			byId('month').textContent = '';
			byId('day').textContent = '?';
			byId('weekday').textContent = '';
			byId('time').textContent = '';
			byId('range').textContent = '';
		}

		byId('kind').textContent = KINDS.includes(f.kind) ? t('field.kind.choice.' + f.kind) : '';
		const title = byId('title');
		title.textContent = f.title || (host.preview ? t('field.title.label') : '');
		title.classList.toggle('empty', !f.title);
		byId('place').textContent = f.place || '';

		const agenda = byId('agenda');
		agenda.replaceChildren();
		const items = Array.isArray(f.agenda) ? f.agenda : (f.agenda ? [f.agenda] : []);
		for (const item of items) {
			const li = document.createElement('li');
			li.textContent = String(item);
			agenda.appendChild(li);
		}

		const join = byId('join');
		join.textContent = t('page.join');
		const url = typeof f.url === 'string' ? f.url.trim() : '';
		if (/^https?:\/\//i.test(url)) {
			join.href = url;
			join.hidden = false;
		} else {
			join.removeAttribute('href');
			join.hidden = true;
		}
	}

	applyTheme(host.theme);
	render(host.card.fields);
	host.subscribe((type, payload) => {
		if (type === 'theme') applyTheme(payload);
		else if (type === 'card') render(payload && payload.fields);
		else if (type === 'localization') render(host.card.fields);
	});
})();
</script>
</body>
</html>
