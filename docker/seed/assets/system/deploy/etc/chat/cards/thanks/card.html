<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you</title>
<style>
	/* The page of the Thank-you card (see notice/card.html for how a card page works). */
	:root {
		color-scheme: light;
		--text: #3b2a1a;
		--text-soft: #7a624c;
		--edge: rgba(59, 42, 26, 0.12);
		--paper: #fff8ef;
		--glow-1: #ffd59e;
		--glow-2: #f8bbd0;
	}
	:root[data-theme="dark"] {
		color-scheme: dark;
		--text: #f6eadb;
		--text-soft: #cdb79f;
		--edge: rgba(255, 255, 255, 0.12);
		--paper: #2a2320;
		--glow-1: #7a4e1f;
		--glow-2: #6d2f49;
	}
	html, body { margin: 0; padding: 0; background: transparent; }
	body {
		font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans JP", sans-serif;
		color: var(--text);
	}
	.card {
		position: relative;
		padding: 1.125rem 1.25rem 1rem;
		border: 1px solid var(--edge);
		border-radius: 12px;
		background:
			radial-gradient(120% 80% at 100% 0%, var(--glow-2), transparent 55%),
			radial-gradient(100% 90% at 0% 100%, var(--glow-1), transparent 60%),
			var(--paper);
		overflow: hidden;
	}
	.card::after {
		content: "\201C";
		position: absolute;
		right: 0.75rem;
		top: -0.75rem;
		font-family: Georgia, "Times New Roman", serif;
		font-size: 7rem;
		line-height: 1;
		opacity: 0.08;
		pointer-events: none;
	}
	.heading {
		font-family: Georgia, "Times New Roman", "Hiragino Mincho ProN", "Yu Mincho", serif;
		font-size: 1.5rem;
		font-weight: 700;
		letter-spacing: 0.01em;
	}
	.to { margin-top: 0.125rem; color: var(--text-soft); font-weight: 600; }
	.message {
		margin: 0.625rem 0 0;
		font-size: 14px;
		line-height: 1.65;
		white-space: pre-wrap;
		overflow-wrap: anywhere;
	}
	.message.empty, .to.empty { color: var(--text-soft); font-style: italic; }
	.from {
		margin-top: 0.75rem;
		text-align: right;
		color: var(--text-soft);
		font-size: 12px;
	}
	.from:empty { display: none; }
</style>
</head>
<body>
<div class="card">
	<div class="heading">Thank you</div>
	<div class="to" id="to"></div>
	<p class="message" id="message"></p>
	<div class="from" id="from"></div>
</div>
<script>
(() => {
	let host = null;
	try {
		host = window.parent && window.parent.ChatCardHost ? window.parent.ChatCardHost.connect(window) : null;
	} catch (e) {
		host = null;
	}
	if (!host) {
		document.body.textContent = 'This page is shown as a card of a conversation.';
		return;
	}

	const byId = (id) => document.getElementById(id);

	function applyTheme(theme) {
		document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
	}

	function render(fields) {
		const f = fields || {};
		const to = byId('to');
		to.textContent = f.to ? 'to ' + f.to : (host.preview ? 'to …' : '');
		to.classList.toggle('empty', !f.to);
		const message = byId('message');
		message.textContent = f.message || (host.preview ? 'Message' : '');
		message.classList.toggle('empty', !f.message);
		// Signed by whoever posted it; the preview shows who is writing.
		const m = host.message;
		const author = m ? (m.authorName || m.author || '') : (host.currentUser && host.currentUser.id) || '';
		byId('from').textContent = author ? '— ' + author : '';
	}

	applyTheme(host.theme);
	render(host.card.fields);
	host.subscribe((type, payload) => {
		if (type === 'theme') applyTheme(payload);
		else if (type === 'card') render(payload && payload.fields);
	});
})();
</script>
</body>
</html>
