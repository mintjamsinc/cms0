# Provisioning for the Webtop's notification center.
#
# A notice — "A sent you a message", "a task was assigned to you" — is kept
# for the user it is for, so that the notification center shows the same
# list on every desktop the user opens, and a notice read or dismissed on
# one is read or dismissed on all. The records are written by
# webtop-notice-service-user only, through webtop.notices.Notices
# (/usr/local/classes/webtop/notices); the GraphQL resolvers
# (etc/graphql/webtop/notices) act for the caller as the service user.
#
#   /home/users/<user>/notices    one file per notice, in the user's home,
#                                 so that the list goes with the user:
#                                 deleting the user removes it, and a user
#                                 made anew under the same id starts with
#                                 none. The home is the user's alone; the
#                                 folder is created with the first notice,
#                                 as the user, and granted jcr:all to the
#                                 service group, which writes it from then
#                                 on. The user watches it with nodeChanged.
#
# Nothing is provisioned for the records themselves: the home exists, or is
# made sure of, when the folder is created (ScriptAPI.createUserContext).
#
# The notice: namespace names the properties of a record.

namespaces:
  - prefix: notice
    uri: http://www.mintjams.jp/webtop/notices/1.0

groups:
  - { id: webtop-notice-service-group, displayName: Webtop Notice Service }

users:
  - id: webtop-notice-service-user
    service: true
    displayName: Webtop Notice Service
    memberOf: [webtop-notice-service-group]
